name: Cinnamon 26

# ============================================================================
#  RICH LINUX - CINNAMON + Chrome Remote Desktop
# ============================================================================
#  Menyediakan desktop Cinnamon lengkap di GitHub-hosted runner (ubuntu-26.04),
#  dapat diakses dari browser lewat Chrome Remote Desktop.
#
#  Kenapa Cinnamon:
#    - Cinnamon 6.4 masih mendukung sesi X11, jalur yang paling stabil untuk
#      Chrome Remote Desktop. GNOME 50 di Ubuntu 26.04 sudah Wayland-only,
#      sehingga varian GNOME X11 tidak bisa dipakai di sana.
#    - Ringan, familiar, dan tetap bisa memakai tema Catppuccin (GTK + shell).
#
#  CARA PAKAI (dari fork Anda sendiri):
#    1. Fork repo ini, lalu aktifkan Actions di fork
#       (Settings > Actions > General > Allow all actions).
#    2. (Opsional) Set secret CRD_PIN (min. 6 digit). Default: 123456.
#    3. Tab Actions -> workflow ini -> Run workflow (TANPA input auth).
#    4. Tunggu ~20-40 menit. Setelah desktop siap, workflow menampilkan
#       URL form otorisasi (Cloudflare quick tunnel) di log + Job Summary.
#    5. Buka URL itu, lalu di tab lain buka
#       https://remotedesktop.google.com/headless -> Begin -> Next ->
#       Authorize, copy SELURUH perintah "Debian Linux", paste ke form,
#       lalu submit. Kode dibuat SETELAH desktop siap, jadi tidak kedaluwarsa.
#    6. Workflow langsung mendaftarkan device. Connect ke
#       https://remotedesktop.google.com/access (device "cinnamon", user
#       "runner").
#
#  Input `crd_host_command` tetap ada sebagai FALLBACK opsional kalau tunnel
#  gagal dibuat. Normalnya biarkan kosong.
#
#  Panduan lengkap + troubleshooting: README.md / docs/troubleshooting.md.
#  Batas: job GitHub-hosted maksimum 6 jam, jadi sesi hidup ~6 jam per run.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "OPSIONAL (fallback): paste perintah CRD. Normalnya biarkan kosong - form web muncul setelah desktop siap."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for scripts/)
        uses: actions/checkout@v4

      - id: dated
        run: echo "today=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      # CATATAN: `actions/cache@v4` dengan input `save-always` sudah DEPRECATED
      # dan tidak berfungsi sesuai niat (lihat action.yml resmi: "save-always
      # does not work as intended and will be removed in a future release").
      # Padahal save-always justru penting di sini: cache .deb harus tetap
      # tersimpan walau STEP 17 (register CRD) gagal, supaya re-run berikutnya
      # tidak mengunduh ulang ~GB. Solusi resmi: pisah restore + save, dan
      # save pakai `if: always()` (lihat step "Save apt package cache").
      - name: Restore apt package cache (re-run cepat, tak unduh ulang ~GB)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-cinnamon-${{ steps.dated.outputs.today }}
          restore-keys: |
            apt-ubuntu-2604-cinnamon-

      # ============================================================
      # PREPARE SYSTEM
      # ============================================================
      - name: Prepare System
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/01-prepare-system.sh"

      # ============================================================
      # INSTALL CINNAMON
      #
      # Sengaja memakai metapackage `cinnamon` + daftar paket eksplisit,
      # BUKAN `cinnamon-core`/`cinnamon-desktop-environment`. Keduanya
      # bergantung pada `slick-greeter | lightdm | x-display-manager`,
      # sehingga akan menarik display manager yang tidak dibutuhkan CRD.
      # `--no-install-recommends` juga mencegah lightdm ikut lewat Recommends.
      # ============================================================
      - name: Install Cinnamon Desktop
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/02-install-cinnamon-desktop.sh"

      # ============================================================
      # CREATE REMOTE USER
      # ============================================================
      - name: Setup Remote User
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/03-setup-remote-user.sh"

      # ============================================================
      # INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/04-install-google-chrome.sh"

      # ============================================================
      # INSTALL VS CODE
      # ============================================================
      - name: Install VS Code
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/05-install-vs-code.sh"

      # ============================================================
      # INSTALL OPENCODE CLI
      # ============================================================
      - name: Install OpenCode CLI
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/06-install-opencode-cli.sh"

      # ============================================================
      # INSTALL OPENCODE DESKTOP
      # ============================================================
      - name: Install OpenCode Desktop
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/07-install-opencode-desktop.sh"

      # ============================================================
      # INSTALL CHROME REMOTE DESKTOP
      # ============================================================
      - name: Install Chrome Remote Desktop
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/08-install-chrome-remote-desktop.sh"

      # Simpan arsip .deb ke cache GitHub SEKARANG (sebelum register) —
      # kalau STEP 16 gagal & user re-run, install tidak perlu unduh ulang.
      - name: Sync apt cache for GitHub save
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/09-sync-apt-cache-for-github-save.sh"

      # Simpan cache SEKARANG, saat .deb berukuran besar (GNOME, Chrome,
      # VS Code, OpenCode, Chrome Remote Desktop) sudah ada di
      # /var/cache/apt/archives. Diletakkan SEBELUM STEP 17 sengaja:
      # `if: always()` tetap menyimpan cache walau step sebelumnya gagal,
      # dan karena tidak ada di akhir job, cache tidak ikut hilang bila job
      # kena timeout 6 jam saat Keep Alive.
      # `continue-on-error`: kalau cache dengan key hari ini sudah ada (re-run
      # di tanggal yang sama), save tidak bisa menimpa key yang sama -> jangan
      # sampai menggagalkan job.
      - name: Save apt package cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-cinnamon-${{ steps.dated.outputs.today }}


      # ============================================================
      # CONFIGURE CINNAMON SESSION (CRD HEADLESS, X11, DIRECT EXEC)
      #
      # Pelajaran dari workflow GNOME: jangan memakai /etc/X11/Xsession atau
      # display manager. CRD sudah menyediakan Xorg + DISPLAY + XAUTHORITY,
      # jadi jalankan cinnamon-session langsung via absolute path.
      #
      # Cinnamon 6.4 masih mendukung X11 (cinnamon.session), berbeda dari
      # GNOME 50 di Ubuntu 26.04 yang Wayland-only. Fallback cinnamon2d
      # tersedia untuk diagnosis layar hitam, tetapi tidak dipakai default
      # karena mode 2D membatasi FPS dan mematikan efek.
      # ============================================================
      - name: Configure CRD Cinnamon Session
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/10-configure-crd-cinnamon-session.sh"

      # ============================================================
      # DISABLE SCREENSAVER + LOCK + SUSPEND (HEADLESS CRD)
      # Mencegah Cinnamon mengunci/mematikan layar dan memutus sesi CRD.
      # ============================================================
      - name: Disable Screensaver and Lock
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/11-disable-screensaver-and-lock.sh"

      # ============================================================
      # CONFIGURE CINNAMON EFFECTS + FAVORITES
      #
      # Catatan penting: Cinnamon 6.4 (js/ui/main.js) menetapkan
      #   software_rendering = !backend.is_rendering_hardware_accelerated()
      #   animations_enabled = !software_rendering && desktop-effects-workspace
      # sehingga di CRD/llvmpipe (tanpa GPU) animasi tetap dimatikan walau
      # enable-animations=true. Cinnamon TIDAK punya global.force_animations
      # seperti GNOME, jadi jangan pasang ekstensi force-animations di sini.
      # Preferensi tetap diset agar benar saat GPU tersedia.
      # ============================================================
      - name: Configure Cinnamon Effects and Favorites
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/12-configure-cinnamon-effects-and-favorites.sh"

      # ============================================================
      # INSTALL SAFE-UPGRADE HELPER
      # Pengganti `sudo apt upgrade` manual yang memutus sesi CRD.
      # ============================================================
      - name: Install Safe Upgrade Helper
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/13-install-safe-upgrade-helper.sh"

      # ============================================================
      # CREATE DESKTOP SHORTCUTS
      # ============================================================
      - name: Create Desktop Shortcuts
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/14-create-desktop-shortcuts.sh"

      # ============================================================
      # SET WALLPAPER (BLACK UNICAT / CATPPUCCIN)
      # ============================================================
      - name: Set Wallpaper
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/15-set-wallpaper.sh"

      # ============================================================
      # INSTALL CATPPUCCIN THEME (MACCHIATO + MAUVE)
      #
      # Tema desktop lengkap untuk sesi CRD:
      #   1) Ikon Papirus + folder warna Catppuccin
      #   2) Tema GTK2/3/4 (berisi juga cinnamon.css + css libadwaita)
      #   3) Override libadwaita di ~/.config/gtk-4.0 (Files, Settings, dll)
      #   4) Kursor Catppuccin
      #   5) Font JetBrainsMono Nerd Font
      #   6) Tema shell Cinnamon via org.cinnamon.theme (cinnamon.css)
      #   7) Profil GNOME Terminal Catppuccin Macchiato (terminal default Cinnamon)
      #
      # Semua ditulis ke dconf user 'runner' lewat dbus-run-session (pola
      # yang sama dengan STEP 10/11/14) supaya langsung terbaca saat sesi
      # CRD menyala. Versi aset di-pin agar build reprodusibel.
      # ============================================================
      - name: Install Catppuccin Theme (Macchiato + Mauve)
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/16-install-catppuccin-theme-macchiato-mauve.sh"

      # ============================================================
      # SET CRD PIN
      #
      # Default:
      #   123456
      #
      # Custom:
      #   Create GitHub Actions secret/variable:
      #
      #   CRD_PIN=your-pin
      # ============================================================
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/17-configure-crd-pin.sh"

      # ============================================================
      # AUTHORIZE VIA WEB + REGISTER CHROME REMOTE DESKTOP
      #
      # Kenapa: kode OAuth `--code=...` dari halaman headless Google hanya
      # sekali pakai dan cepat kadaluarsa. Instalasi desktop di STEP 01-16
      # butuh 20-40 menit, jadi kode yang diminta di awal (workflow_dispatch)
      # sudah kedaluwarsa saat dipakai.
      #
      # Solusi: setelah desktop siap, step ini menjalankan form web lokal dan
      # mengeksposnya lewat Cloudflare quick tunnel (tanpa akun). User baru
      # membuat kode SETELAH URL muncul, lalu submit dari jaringan mana pun.
      # Kalau registrasi gagal, user bisa submit kode baru tanpa re-run.
      #
      # Keamanan: URL memakai token acak 128-bit; form hanya menerima perintah
      # `start-host` (allowlist karakter); bind ke 127.0.0.1; hanya satu
      # perintah yang diproses pada satu waktu. Jangan bagikan URL ini.
      # ============================================================
      - name: Authorize & Register Chrome Remote Desktop (Web UI)
        env:
          FALLBACK_CMD: ${{ inputs.crd_host_command }}
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/18-authorize-register-chrome-remote-desktop-web-ui.sh"

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/19-verify-installation.sh"

      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: bash "$GITHUB_WORKSPACE/scripts/cinnamon/20-keep-alive.sh"
