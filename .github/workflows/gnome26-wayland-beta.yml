name: GNOME 26 + CRD (Wayland BETA)

# ==============================================================================
#  RICH LINUX · GNOME 50 (Ubuntu 26.04) + Chrome Remote Desktop · Wayland
# ------------------------------------------------------------------------------
#  Status   : Terverifikasi 7 Nov 2026 (AV1 ±60 fps, audio PipeWire, input EI,
#             animasi aktif). Mode Wayland CRD masih eksperimental di upstream
#             dan dapat berubah antar versi CRD / Mutter / PipeWire.
#             Untuk jalur X11 yang stabil, gunakan gnome24.yml (Ubuntu 24.04).
#  Detail   : docs/wayland-crd.md
#
#  Cara pakai (dari fork sendiri)
#    1. Fork repo, aktifkan Actions.
#    2. (Opsional) Buat secret CRD_PIN (min. 6 digit). Default: 123456.
#    3. Actions -> "GNOME 26 + CRD (Wayland BETA)" -> Run workflow (±20-40 menit).
#    4. Setelah desktop siap, buka URL form otorisasi yang tampil di log
#       (Cloudflare quick tunnel).
#    5. Buka https://remotedesktop.google.com/headless -> Authorize -> salin
#       perintah "Debian Linux" -> tempel ke form -> submit.
#    6. Connect lewat https://remotedesktop.google.com/access (device "gnome").
#
#  Tentang log
#    - Proses install/unduh berjalan "senyap": log tampil sebagai satu baris
#      per tugas (✔ label + durasi). Log lengkap disimpan di /tmp/ci-logs.
#    - Saat sebuah tugas gagal, 80 baris terakhirnya langsung dicetak, dan
#      seluruh log diunggah sebagai artifact `install-logs-<run id>`
#      (hanya bila job gagal).
#    - Tab Summary berisi tabel status + durasi tiap step dan info akses.
#
#  Catatan
#    - Input `crd_host_command` hanya fallback bila tunnel gagal dibuat.
#    - Layar blank setelah connect: tunggu 1-2 menit lalu reconnect; watchdog
#      me-restart host otomatis saat mendeteksi crash.
#    - Jangan jalankan dua run bersamaan (device "gnome" bisa duplikat).
#    - Batas job GitHub-hosted 6 jam, sehingga sesi hidup ±6 jam per run.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "OPSIONAL (fallback): perintah CRD. Normalnya kosongkan - form web muncul setelah desktop siap."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for scripts/)
        uses: actions/checkout@v4

      - id: dated
        run: echo "today=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      # Helper logging bersama; di-source oleh setiap step berikutnya.
      #   run_quiet "label" cmd...  -> jalankan senyap, log ke /tmp/ci-logs,
      #                                tampilkan satu baris hasil (+ durasi).
      #   Variabel opsional: RQ_SOFT=1 (gagal = peringatan, bukan error),
      #                      RQ_NOCMD=1 (jangan tulis command line ke log).
      # CATATAN: fungsi yang diberikan ke run_quiet berjalan dalam konteks `||`,
      # sehingga `set -e` tidak aktif di dalamnya; gunakan `|| return 1` eksplisit.
      - name: Initialize logging helpers
        run: |
          rm -rf /tmp/ci-logs /tmp/ci-steps.tsv /tmp/dl
          mkdir -p /tmp/ci-logs /tmp/dl
          cat > /tmp/ci-lib.sh <<'LIB'
          C_B=$'\033[1m'; C_D=$'\033[2m'; C_R=$'\033[31m'; C_G=$'\033[32m'
          C_Y=$'\033[33m'; C_C=$'\033[36m'; C_N=$'\033[0m'
          CI_LOG_DIR=/tmp/ci-logs
          CI_STEPS=/tmp/ci-steps.tsv
          mkdir -p "$CI_LOG_DIR"

          fmt_dur() {
            local s="$1"
            if [ "$s" -ge 60 ]; then printf '%dm%02ds' $((s / 60)) $((s % 60)); else printf '%ds' "$s"; fi
          }
          step() {
            STEP_ID="$1"; STEP_TITLE="$2"; STEP_T0=$(date +%s)
            printf '\n%s[%s]%s  %s%s%s\n' "$C_C" "$1" "$C_N" "$C_B" "$2" "$C_N"
            printf 'S\t%s\t%s\t%s\n' "$1" "$2" "$STEP_T0" >> "$CI_STEPS"
          }
          step_done() {
            local dt=$(( $(date +%s) - STEP_T0 ))
            printf 'D\t%s\t%s\n' "$STEP_ID" "$dt" >> "$CI_STEPS"
            printf '  %s· selesai dalam %s%s\n' "$C_D" "$(fmt_dur "$dt")" "$C_N"
          }
          info() { printf '  %s·%s %s\n' "$C_D" "$C_N" "$*"; }
          ok()   { printf '  %s✔%s %s\n' "$C_G" "$C_N" "$*"; }
          warn() { printf '  %s!%s %s\n' "$C_Y" "$C_N" "$*"; }
          fail() { printf '  %s✘%s %s\n' "$C_R" "$C_N" "$*"; echo "::error::$*"; }
          kv()   { printf '    %s%-11s%s %s\n' "$C_D" "$1" "$C_N" "$2"; }

          run_quiet() {
            local label="$1"; shift
            local slug log t0 rc=0 dt
            slug="$(printf '%s' "$label" | tr -c 'A-Za-z0-9' '-' | cut -c1-40)"
            log="$CI_LOG_DIR/$(date +%H%M%S)-$$-${slug}.log"
            t0=$(date +%s)
            {
              if [ -z "${RQ_NOCMD:-}" ]; then printf '$ %s\n' "$*"; fi
              "$@"
            } > "$log" 2>&1 || rc=$?
            dt=$(( $(date +%s) - t0 ))
            if [ "$rc" -eq 0 ]; then
              ok "$label ($(fmt_dur "$dt"))"
              return 0
            fi
            if [ -n "${RQ_SOFT:-}" ]; then
              warn "$label: gagal (exit $rc, $(fmt_dur "$dt"))"
            else
              fail "$label: gagal (exit $rc, $(fmt_dur "$dt"))"
            fi
            echo "::group::Log: $label (80 baris terakhir)"
            tail -n 80 "$log"
            echo "::endgroup::"
            return "$rc"
          }
          LIB

      # Cache .deb: restore di awal, save terpisah (`if: always()`) sebelum
      # step registrasi, supaya re-run setelah kegagalan tidak mengunduh ulang.
      - name: Restore apt package cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}
          restore-keys: |
            apt-ubuntu-2604-

      # ------------------------------------------------------------------
      # 01 · PREPARE SYSTEM
      # Semua repo pihak ketiga (VS Code, Chrome, CRD) ditambahkan di sini
      # agar cukup SATU `apt-get update` untuk seluruh workflow.
      # ------------------------------------------------------------------
      - name: Prepare System
        run: |
          source /tmp/ci-lib.sh
          step "01/11" "Prepare system"

          # Waktu mulai job; dipakai Keep Alive & Summary untuk sisa/total waktu.
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          # Timezone Asia/Jakarta (WIB). timedatectl tidak memperbarui
          # /etc/timezone, jadi keduanya disamakan agar tidak kembali ke UTC.
          TZ_TARGET="Asia/Jakarta"
          if [ ! -e "/usr/share/zoneinfo/$TZ_TARGET" ]; then
            fail "zoneinfo $TZ_TARGET tidak tersedia"
            exit 1
          fi
          sudo timedatectl set-timezone "$TZ_TARGET" 2>/dev/null || true
          echo "$TZ_TARGET" | sudo tee /etc/timezone > /dev/null
          sudo ln -sf "/usr/share/zoneinfo/$TZ_TARGET" /etc/localtime
          sudo DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive tzdata > /dev/null 2>&1 || true
          sudo ln -sf "/usr/share/zoneinfo/$TZ_TARGET" /etc/localtime
          if [ "$(cat /etc/timezone 2>/dev/null)" != "$TZ_TARGET" ] || [ "$(date +%z)" != "+0700" ]; then
            fail "Timezone tidak ter-set ke $TZ_TARGET"
            exit 1
          fi
          ok "Timezone: $(date +'%Z %z')"

          # Nonaktifkan needrestart (hook apt 99needrestart / 20needrestart)
          # agar apt tidak memindai proses atau me-restart service CRD.
          sudo rm -f /etc/apt/apt.conf.d/99needrestart /etc/apt/apt.conf.d/20needrestart || true
          sudo mkdir -p /etc/needrestart/needrestart.conf.d || true
          printf '%s\n' \
            "\$nrconf{restart} = 'l';" \
            '$nrconf{kernelhints} = 0;' \
            '$nrconf{check} = 0;' \
            | sudo tee /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null

          sudo tee /etc/apt/apt.conf.d/99-speed > /dev/null <<'APTEOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::http::Pipeline-Depth "10";
          Acquire::Languages "none";
          APTEOF
          ok "needrestart dinonaktifkan · apt dioptimalkan"

          # Seed cache .deb dari GitHub cache (hemat ~GB saat re-run).
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -a /home/runner/apt-archives/. /var/cache/apt/archives/ 2>/dev/null || true

          # Repo pihak ketiga: VS Code, Google Chrome, Chrome Remote Desktop.
          # Kunci Google yang sama dipakai Chrome dan CRD. File
          # /etc/default/google-chrome mencegah paket Chrome menambah repo-nya
          # sendiri (menghindari sumber ganda).
          add_repos() {
            sudo mkdir -p /etc/apt/keyrings || return 1
            wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
              | gpg --dearmor | sudo tee /etc/apt/keyrings/packages.microsoft.gpg > /dev/null || return 1
            wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
              | gpg --dearmor | sudo tee /etc/apt/keyrings/google-linux.gpg > /dev/null || return 1
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
              | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null || return 1
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null || return 1
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome-remote-desktop/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list > /dev/null || return 1
            echo 'repo_add_once="false"' | sudo tee /etc/default/google-chrome > /dev/null || return 1
          }
          run_quiet "Tambah repo VS Code, Chrome, CRD" add_repos

          run_quiet "Perbarui daftar paket" sudo apt-get update -qq

          RQ_SOFT=1 run_quiet "Hapus paket tidak diperlukan" \
            sudo apt-get remove -y -qq --purge man-db firewalld ufw || true
          RQ_SOFT=1 run_quiet "Autoremove" sudo apt-get autoremove -y -qq || true

          # Hapus snapd + paket transisi snap SEBELUM upgrade agar apt tidak
          # menunggu snap store; hold mencegah terpasang kembali.
          sudo systemctl stop snapd.service snapd.socket 2>/dev/null || true
          RQ_SOFT=1 run_quiet "Hapus snapd & paket transisi snap" \
            sudo apt-get purge -y -qq snapd thunderbird firefox || true
          sudo apt-mark hold snapd thunderbird firefox > /dev/null
          sudo rm -rf /snap /var/snap /var/lib/snapd /root/snap /home/runner/snap 2>/dev/null || true

          # Full upgrade hanya saat build. Dari dalam sesi CRD gunakan `safe-upgrade`.
          run_quiet "Full upgrade sistem" \
            sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get upgrade -y -q \
              -o Dpkg::Options::="--force-unsafe-io" \
              -o Dpkg::Use-Pty=0

          step_done


      # ------------------------------------------------------------------
      # 02 · DESKTOP + APLIKASI (SATU TRANSAKSI APT)
      # GNOME, Chrome, VS Code, dan CRD dipasang dalam satu transaksi.
      # Selama itu, .deb OpenCode Desktop dan cloudflared diunduh di background.
      # ------------------------------------------------------------------
      - name: Install Desktop & Applications
        run: |
          source /tmp/ci-lib.sh
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          export NEEDRESTART_SUSPEND=1
          step "02/11" "Install desktop & applications"

          # Lewati font Noto raksasa (Recommends saja, ±285 MB) dan blokir
          # snapd/thunderbird/firefox (paket transisi snap yang membuat
          # postinst menunggu snap store). Pin dihapus setelah install.
          sudo tee /etc/apt/preferences.d/99-no-noto-heavy > /dev/null <<'PREFE'
          Package: fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-extra
          Pin: version *
          Pin-Priority: -1
          PREFE

          sudo tee /etc/apt/preferences.d/99-no-snap.pref > /dev/null <<'PREFE'
          Package: snapd thunderbird firefox
          Pin: version *
          Pin-Priority: -10
          PREFE

          # Unduhan background (berjalan paralel dengan transaksi apt).
          mkdir -p /tmp/dl
          ( RQ_SOFT=1 run_quiet "Unduh OpenCode Desktop" \
              wget -q https://opencode.ai/download/stable/linux-x64-deb -O /tmp/dl/opencode-desktop.deb
          ) > "$CI_LOG_DIR/bg-opencode.out" 2>&1 &
          BG_OPENCODE=$!
          ( RQ_SOFT=1 run_quiet "Unduh cloudflared" \
              curl -fsSL --retry 3 --retry-delay 2 -o /tmp/cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            && chmod +x /tmp/cloudflared
          ) > "$CI_LOG_DIR/bg-cloudflared.out" 2>&1 &
          BG_CLOUDFLARED=$!

          run_quiet "Pasang GNOME, Chrome, VS Code & CRD (±2 GB)" \
            sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              -o Dpkg::Use-Pty=0 \
              ubuntu-desktop \
              ubuntu-desktop-minimal \
              ubuntu-session \
              gnome-session \
              gnome-shell \
              gnome-control-center \
              nautilus \
              gnome-terminal \
              dbus-x11 \
              dbus-user-session \
              x11-xserver-utils \
              xwayland \
              pipewire \
              pipewire-pulse \
              wireplumber \
              xdg-desktop-portal \
              xdg-desktop-portal-gnome \
              xorg \
              adwaita-icon-theme \
              fonts-cantarell \
              fonts-ubuntu \
              yaru-theme-icon \
              ubuntu-wallpapers \
              qemu-system-x86 \
              qemu-utils \
              libvirt-daemon-system \
              libvirt-clients \
              virtinst \
              xclip \
              fastfetch \
              virt-manager \
              gnome-boxes \
              google-chrome-stable \
              code \
              chrome-remote-desktop

          # Hasil unduhan background (kegagalan tidak fatal: OpenCode Desktop
          # diunduh ulang di step 04, cloudflared di step 10).
          wait "$BG_OPENCODE" || true
          wait "$BG_CLOUDFLARED" || true
          cat "$CI_LOG_DIR/bg-opencode.out" "$CI_LOG_DIR/bg-cloudflared.out" 2>/dev/null || true

          sudo rm -f /etc/apt/preferences.d/99-no-snap.pref /etc/apt/preferences.d/99-no-noto-heavy

          # Tidak ada paket yang hard-depends ke snapd di install graph ini.
          RQ_SOFT=1 run_quiet "Hapus snapd & paket transisi snap" \
            sudo apt-get purge -y -qq snapd thunderbird firefox || true
          sudo apt-mark hold snapd thunderbird firefox > /dev/null
          sudo rm -rf /snap /var/snap /var/lib/snapd /root/snap /home/runner/snap 2>/dev/null || true
          if command -v snap >/dev/null 2>&1; then warn "snap masih terdeteksi"; fi

          run_quiet "Kompilasi GSettings schemas" sudo glib-compile-schemas /usr/share/glib-2.0/schemas/ || true

          # CRD menjalankan instance PipeWire sendiri (crd_audio). Template
          # bawaan hanya memetakan audio.convert; tanpa video.convert PipeWire
          # gagal menyisipkan adapter ("no more input formats") dan layar hitam.
          # Idempoten; file vendor dapat berubah saat paket CRD di-upgrade.
          PW_TEMPLATE=/opt/google/chrome-remote-desktop/pipewire.conf.template
          if [ -f "$PW_TEMPLATE" ] && ! sudo grep -q 'video\.convert' "$PW_TEMPLATE"; then
            sudo sed -i '/audio\.convert\.\*/a\    video.convert.* = videoconvert/libspa-videoconvert' "$PW_TEMPLATE"
            ok "Template PipeWire CRD: video.convert ditambahkan"
          fi

          ok "GNOME: $(gnome-shell --version 2>/dev/null || echo '?')"
          ok "Chrome: $(google-chrome --version 2>/dev/null || echo '?')"
          ok "VS Code: $(code --version 2>/dev/null | head -n 1 || echo '?')"
          ok "CRD: $(dpkg-query -W -f='${Version}' chrome-remote-desktop 2>/dev/null || echo '?')"

          step_done


      # ------------------------------------------------------------------
      # 03 · REMOTE USER
      # ------------------------------------------------------------------
      - name: Setup Remote User
        run: |
          source /tmp/ci-lib.sh
          step "03/11" "Setup remote user"

          sudo useradd -m -s /bin/bash runner || true
          echo "runner:root" | sudo chpasswd
          sudo usermod -aG sudo runner

          # Akses KVM + libvirt. Pola resmi GitHub: udev rule agar /dev/kvm
          # dapat dibuka tanpa grup 'kvm'. No-op bila KVM tidak tersedia.
          # Ref: https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo usermod -aG kvm runner || warn "grup 'kvm' tidak ada di runner ini (KVM nonaktif)"
          sudo usermod -aG libvirt runner || true

          # Bila daemon CRD sudah berjalan (mis. re-run), restart agar systemd
          # membaca ulang grup (kvm, libvirt); tanpa ini virt-manager gagal di
          # libvirt-sock dan /dev/kvm tak terbaca.
          if systemctl is-active --quiet chrome-remote-desktop@runner 2>/dev/null; then
            sudo systemctl restart chrome-remote-desktop@runner 2>/dev/null || true
          fi
          if sudo -u runner test -r /dev/kvm && sudo -u runner test -w /dev/kvm; then
            ok "KVM tersedia untuk runner"
          else
            warn "/dev/kvm belum dapat diakses runner (perlu re-login)"
          fi

          echo 'export NEEDRESTART_MODE=l' | sudo tee -a /home/runner/.bashrc > /dev/null
          echo 'export NEEDRESTART_SUSPEND=1' | sudo tee -a /home/runner/.bashrc > /dev/null
          sudo mkdir -p /home/runner/Desktop
          sudo chown -R runner:runner /home/runner

          ok "User siap: $(id runner)"
          step_done


      # ------------------------------------------------------------------
      # 04 · OPENCODE (CLI + DESKTOP)
      # ------------------------------------------------------------------
      - name: Install OpenCode
        run: |
          source /tmp/ci-lib.sh
          step "04/11" "Install OpenCode"

          if ! command -v curl > /dev/null 2>&1; then
            run_quiet "Pasang curl" sudo apt-get install -y -qq curl
          fi

          # Installer selalu memasang ke $HOME/.opencode/bin (mengabaikan
          # OPENCODE_INSTALL_DIR); PATH diekspor manual untuk step ini.
          install_opencode_cli() { ( set -o pipefail; curl -fsSL https://opencode.ai/v2/install | bash ); }
          run_quiet "OpenCode CLI" install_opencode_cli
          export PATH="$HOME/.opencode/bin:$PATH"

          # Salin system-wide agar tersedia untuk root, runner, dan GNOME Terminal.
          sudo cp "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode || true
          sudo chmod +x /usr/local/bin/opencode || true
          ok "OpenCode CLI $(opencode --version)"

          # .deb sudah diunduh di background pada step 02; unduh ulang bila belum ada.
          mkdir -p /tmp/dl
          if [ ! -s /tmp/dl/opencode-desktop.deb ]; then
            run_quiet "Unduh OpenCode Desktop" \
              wget -q https://opencode.ai/download/stable/linux-x64-deb -O /tmp/dl/opencode-desktop.deb
          fi
          run_quiet "OpenCode Desktop" \
            sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
              -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
              -o Dpkg::Use-Pty=0 /tmp/dl/opencode-desktop.deb
          rm -f /tmp/dl/opencode-desktop.deb

          step_done

      # Salin arsip .deb sebelum registrasi; bila step registrasi gagal,
      # re-run tidak perlu mengunduh ulang.
      - name: Sync apt cache for GitHub save
        run: |
          sudo mkdir -p /home/runner/apt-archives
          sudo cp -a /var/cache/apt/archives/. /home/runner/apt-archives/ || true
          sudo chown -R runner:runner /home/runner/apt-archives || true

      # `if: always()` menyimpan cache walau step sebelumnya gagal. Diletakkan
      # sebelum registrasi agar tidak hilang bila job kena timeout saat Keep Alive.
      # `continue-on-error`: key hari ini yang sudah ada tidak bisa ditimpa.
      - name: Save apt package cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}


      # ------------------------------------------------------------------
      # 05 · GNOME WAYLAND SESSION (BETA)
      # Ubuntu 26.04 / GNOME 50 hanya mendukung Wayland, sedangkan CRD stabil
      # masih X11. Beta ini memakai mode Wayland eksperimental CRD + GNOME
      # Shell headless dengan virtual monitor (tanpa Xorg/Xvfb).
      # ------------------------------------------------------------------
      - name: Configure GNOME Wayland Session (BETA)
        run: |
          source /tmp/ci-lib.sh
          step "05/11" "Configure GNOME Wayland session (BETA)"

          test -x /usr/bin/gnome-session || { fail "/usr/bin/gnome-session tidak ditemukan"; exit 1; }
          test -x /usr/bin/gnome-shell   || { fail "/usr/bin/gnome-shell tidak ditemukan"; exit 1; }
          test -f /usr/share/gnome-session/sessions/ubuntu.session || {
            fail "ubuntu.session tidak ditemukan (paket ubuntu-session belum terpasang)"
            ls /usr/share/gnome-session/sessions/ || true
            exit 1
          }

          RUNNER_UID=$(id -u runner)

          # User manager + D-Bus session bus harus hidup agar GNOME Shell dapat
          # berjalan sebagai systemd user service dan mengekspor WAYLAND_DISPLAY.
          sudo loginctl enable-linger runner || true
          sudo mkdir -p "/run/user/$RUNNER_UID"
          sudo chown runner:runner "/run/user/$RUNNER_UID"
          sudo chmod 700 "/run/user/$RUNNER_UID"

          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          for i in {1..30}; do
            if [ -S "/run/user/$RUNNER_UID/systemd/private" ] && [ -S "/run/user/$RUNNER_UID/bus" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -S "/run/user/$RUNNER_UID/systemd/private" ]; then
            fail "systemd --user milik runner tidak aktif"
            sudo loginctl list-sessions || true
            exit 1
          fi
          if [ ! -S "/run/user/$RUNNER_UID/bus" ]; then
            fail "D-Bus session bus runner tidak ditemukan: /run/user/$RUNNER_UID/bus"
            ls -la "/run/user/$RUNNER_UID" || true
            exit 1
          fi
          ok "systemd --user + D-Bus session bus aktif"

          # Paksa environment user manager ke Wayland (org.gnome.Shell@.service
          # memiliki AssertEnvironment=XDG_SESSION_TYPE=wayland).
          # XDG_CURRENT_DESKTOP tidak menentukan session mode: CRD selalu
          # memaksa "GNOME" untuk sesi Wayland, sehingga wallpaper/tema di-set
          # eksplisit lewat dconf (step 06).
          as_runner systemctl --user set-environment \
            XDG_SESSION_TYPE=wayland \
            XDG_CURRENT_DESKTOP=GNOME \
            XDG_SESSION_DESKTOP=ubuntu
          as_runner systemctl --user unset-environment \
            WAYLAND_DISPLAY DISPLAY XAUTHORITY GNOME_SETUP_DISPLAY 2>/dev/null || true

          # CRD memanggil `gnome-session` tanpa argumen, sementara satu-satunya
          # mode GNOME Shell yang tersedia adalah "ubuntu". Wrapper memaksanya.
          sudo tee /usr/local/bin/gnome-session > /dev/null <<'WRAP'
          #!/bin/sh
          exec /usr/bin/gnome-session --session=ubuntu --disable-acceleration-check "$@"
          WRAP
          sudo chmod 0755 /usr/local/bin/gnome-session

          # Jalur kedua bila CRD memanggil /usr/bin/gnome-session secara absolut.
          sudo -u runner env HOME=/home/runner \
            dbus-run-session -- \
            gsettings set org.gnome.desktop.session session-name ubuntu > /dev/null 2>&1 || true

          # GNOME Shell 50 tidak punya backend X11; pada runner tanpa GPU shell
          # dijalankan sebagai compositor headless dengan satu virtual monitor.
          sudo mkdir -p /etc/systemd/user/org.gnome.Shell@.service.d
          sudo tee /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf > /dev/null <<'UNIT'
          [Service]
          ExecStart=
          ExecStart=/usr/bin/gnome-shell --mode=%i --wayland --headless --virtual-monitor 1280x720
          UNIT

          # Mode Wayland CRD dipilih lewat environment service. Drop-in ini juga
          # menyediakan bus address yang dibutuhkan gnome-session (crbug.com/432108529).
          sudo mkdir -p /etc/systemd/system/chrome-remote-desktop@.service.d
          sudo tee /etc/systemd/system/chrome-remote-desktop@.service.d/20-wayland-beta.conf > /dev/null <<UNIT
          [Service]
          Environment=CHROME_REMOTE_DESKTOP_USE_WAYLAND=GNOME
          Environment=XDG_SESSION_TYPE=wayland
          Environment=XDG_RUNTIME_DIR=/run/user/$RUNNER_UID
          Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$RUNNER_UID/bus
          Environment=LIBGL_ALWAYS_SOFTWARE=1
          Environment=MUTTER_DEBUG_FORCE_SOFTWARE_RENDER=1
          UNIT

          sudo systemctl daemon-reload
          as_runner systemctl --user daemon-reload

          # Sisa konfigurasi X11 lama tidak dipakai pada mode Wayland.
          sudo -u runner rm -f /home/runner/.chrome-remote-desktop-session
          sudo -u runner rm -f /home/runner/.config/autostart/set-resolution.desktop
          sudo rm -f /usr/local/bin/set-resolution.sh

          # Detail konfigurasi disimpan ke log (ikut artifact bila job gagal).
          {
            echo "--- CRD service drop-in ---"
            systemctl cat chrome-remote-desktop@runner.service | tail -n 20 || true
            echo "--- GNOME Shell user override ---"
            as_runner systemctl --user cat org.gnome.Shell@.service 2>/dev/null | tail -n 20 || true
            echo "--- systemd user environment ---"
            as_runner systemctl --user show-environment | grep -E '^(XDG|DBUS)' || true
          } > "$CI_LOG_DIR/wayland-config.log" 2>&1 || true

          if ! as_runner systemctl --user show-environment | grep -q '^XDG_SESSION_TYPE=wayland$'; then
            fail "Environment systemd user bukan wayland"
            tail -n 60 "$CI_LOG_DIR/wayland-config.log" || true
            exit 1
          fi
          if ! systemctl cat chrome-remote-desktop@runner.service | grep -q 'CHROME_REMOTE_DESKTOP_USE_WAYLAND=GNOME'; then
            fail "Drop-in CRD Wayland tidak terbaca"
            tail -n 60 "$CI_LOG_DIR/wayland-config.log" || true
            exit 1
          fi

          ok "Environment user manager: Wayland"
          ok "GNOME Shell headless (virtual monitor 1280x720) · CRD drop-in Wayland"
          step_done


      # ------------------------------------------------------------------
      # 06 · SCREENSAVER / LOCK / TAMPILAN
      # Mencegah GNOME mengunci/mematikan layar yang memutus sesi CRD, dan
      # menetapkan tampilan default Ubuntu (dark mode).
      # ------------------------------------------------------------------
      - name: Disable Screensaver and Lock
        run: |
          source /tmp/ci-lib.sh
          step "06/11" "Disable screensaver & lock · apply appearance"

          sudo mkdir -p /etc/dconf/db/local.d || true
          sudo tee /etc/dconf/db/local.d/99-crd-no-lock > /dev/null <<'EOF'
          [org/gnome/desktop/session]
          idle-delay=0
          [org/gnome/desktop/screensaver]
          lock-enabled=false
          idle-activation-enabled=false
          lock-delay=0
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-type='nothing'
          ambient-enabled=false
          EOF

          # CRD memaksa XDG_CURRENT_DESKTOP=GNOME, sehingga override
          # [schema:ubuntu] tidak berlaku dan wallpaper jatuh ke adwaita-*.jxl
          # (tidak terpasang) -> layar biru solid. Karena itu wallpaper + tema
          # di-set eksplisit lewat dconf, dengan primary-color aubergine sebagai fallback.
          if ! sudo grep -qs '^system-db:local' /etc/dconf/profile/user 2>/dev/null; then
            printf 'user-db:user\nsystem-db:local\n' | sudo tee /etc/dconf/profile/user > /dev/null
          fi

          # 96 < 97, sehingga 97-crd-dark-mode menang untuk color-scheme/gtk-theme.
          sudo tee /etc/dconf/db/local.d/96-crd-ubuntu-look > /dev/null <<'EOF'
          [org/gnome/desktop/background]
          picture-uri='file:///usr/share/backgrounds/warty-final-ubuntu.png'
          picture-uri-dark='file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
          primary-color='#2c001e'
          secondary-color='#2c001e'
          color-shading-type='solid'
          picture-options='zoom'
          [org/gnome/desktop/interface]
          icon-theme='Yaru'
          cursor-theme='Yaru'
          font-name='Ubuntu Sans 11'
          document-font-name='Sans 11'
          monospace-font-name='Ubuntu Sans Mono 11'
          EOF

          sudo tee /etc/dconf/db/local.d/97-crd-dark-mode > /dev/null <<'EOF'
          [org/gnome/desktop/interface]
          color-scheme='prefer-dark'
          gtk-theme='Yaru-dark'
          EOF
          sudo dconf update > /dev/null 2>&1 || true

          # Fallback gsettings per-user (abaikan bila dbus belum tersedia).
          gs_set() {
            sudo -u runner dbus-launch --exit-with-session gsettings set "$@" >> "$CI_LOG_DIR/appearance.log" 2>&1 || true
          }
          gs_set org.gnome.desktop.screensaver lock-enabled false
          gs_set org.gnome.desktop.screensaver idle-activation-enabled false
          gs_set org.gnome.desktop.session idle-delay 0
          gs_set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing'
          gs_set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/warty-final-ubuntu.png'
          gs_set org.gnome.desktop.background picture-uri-dark 'file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
          gs_set org.gnome.desktop.background primary-color '#2c001e'
          gs_set org.gnome.desktop.background secondary-color '#2c001e'
          gs_set org.gnome.desktop.background picture-options 'zoom'
          gs_set org.gnome.desktop.interface icon-theme 'Yaru'
          gs_set org.gnome.desktop.interface cursor-theme 'Yaru'
          gs_set org.gnome.desktop.interface font-name 'Ubuntu Sans 11'
          gs_set org.gnome.desktop.interface document-font-name 'Sans 11'
          gs_set org.gnome.desktop.interface monospace-font-name 'Ubuntu Sans Mono 11'
          gs_set org.gnome.desktop.interface color-scheme 'prefer-dark'
          gs_set org.gnome.desktop.interface gtk-theme 'Yaru-dark'

          sudo chown -R runner:runner /home/runner/.config || true
          ok "Lock, screensaver, dan suspend dinonaktifkan"
          ok "Tampilan: Ubuntu default · dark mode (prefer-dark + Yaru-dark)"
          step_done


      # ------------------------------------------------------------------
      # 07 · ANIMASI PADA SOFTWARE RENDERING
      #
      # Sesi headless tanpa GPU membuat Mutter melaporkan rendering non-
      # hardware, sehingga GNOME Shell memanggil St.Settings.inhibit_animations()
      # dan menimpa enable-animations. Satu-satunya override resmi adalah
      # global.force_animations, yang hanya dapat di-set dari dalam shell
      # (extension). Ref: GNOME Shell js/ui/main.js (AnimationsSettings).
      # ------------------------------------------------------------------
      - name: Enable GNOME Shell Animations (software rendering fix)
        run: |
          source /tmp/ci-lib.sh
          step "07/11" "Enable animations on software rendering"

          UUID="force-animations@software-rendering"
          EXT_DIR="/usr/share/gnome-shell/extensions/$UUID"
          sudo mkdir -p "$EXT_DIR"

          sudo tee "$EXT_DIR/metadata.json" > /dev/null <<'META_EOF'
          {
            "uuid": "force-animations@software-rendering",
            "name": "Force Animations on Software Rendering",
            "description": "Re-enables GNOME Shell animations on VMs, headless/CI desktops, Chrome Remote Desktop and any GPU-less environment that renders with llvmpipe/swrast, where GNOME Shell silently disables every animation.",
            "shell-version": ["45", "46", "47", "48", "49", "50"],
            "version-name": "1.1.0"
          }
          META_EOF

          sudo tee "$EXT_DIR/extension.js" > /dev/null <<'JS_EOF'
          /* Force GNOME Shell animations on software rendering.
           *
           * GNOME Shell inhibits animations whenever rendering is not hardware
           * accelerated (llvmpipe/swrast: VMs, CRD, VNC, RDP). That inhibit
           * overrides org.gnome.desktop.interface enable-animations.
           * global.force_animations is the supported override and can only be
           * set from inside the shell, hence this extension.
           *
           * St.Settings.slow_down_factor is also applied (default 2.5, override
           * with the GNOME_SHELL_SLOWDOWN_FACTOR environment variable).
           */

          import GLib from 'gi://GLib';
          import St from 'gi://St';

          import {Extension} from 'resource:///org/gnome/shell/extensions/extension.js';

          const LOG_PREFIX = '[force-animations]';
          const DEFAULT_SLOWDOWN = 2.5;

          export default class ForceAnimationsExtension extends Extension {
              enable() {
                  this._previousForceAnimations = global.force_animations;
                  this._previousSlowDownFactor = St.Settings.get().slow_down_factor;
                  this._idleId = 0;

                  const slowdownEnv = GLib.getenv('GNOME_SHELL_SLOWDOWN_FACTOR');
                  const factor = slowdownEnv
                      ? (parseFloat(slowdownEnv) || DEFAULT_SLOWDOWN)
                      : DEFAULT_SLOWDOWN;

                  global.force_animations = true;
                  if (!isNaN(factor) && factor > 0.0) {
                      St.Settings.get().slow_down_factor = factor;
                  }

                  const before = St.Settings.get().enable_animations;

                  this._idleId = GLib.idle_add(GLib.PRIORITY_LOW, () => {
                      this._idleId = 0;
                      const settings = St.Settings.get();
                      console.log(
                          `${LOG_PREFIX} software_rendering=` +
                          `${!global.backend.is_rendering_hardware_accelerated()} ` +
                          `enable_animations_before=${before} ` +
                          `enable_animations_now=${settings.enable_animations} ` +
                          `slow_down_factor=${settings.slow_down_factor}`);
                      return GLib.SOURCE_REMOVE;
                  });
              }

              disable() {
                  if (this._idleId) {
                      GLib.source_remove(this._idleId);
                      this._idleId = 0;
                  }
                  global.force_animations = this._previousForceAnimations ?? false;
                  if (this._previousSlowDownFactor !== undefined) {
                      St.Settings.get().slow_down_factor = this._previousSlowDownFactor;
                  }
              }
          }
          JS_EOF

          sudo chmod 0755 "$EXT_DIR"
          sudo chmod 0644 "$EXT_DIR/metadata.json" "$EXT_DIR/extension.js"

          sudo mkdir -p /etc/environment.d
          printf 'GNOME_SHELL_SLOWDOWN_FACTOR=2.5\n' | sudo tee /etc/environment.d/99-gnome-animation-slow.conf > /dev/null
          # Fallback untuk login via PAM (GDM/lightdm).
          if ! grep -q 'GNOME_SHELL_SLOWDOWN_FACTOR' /etc/environment 2>/dev/null; then
            printf '\nGNOME_SHELL_SLOWDOWN_FACTOR=2.5\n' | sudo tee -a /etc/environment > /dev/null
          fi

          sudo mkdir -p /etc/dconf/db/local.d
          sudo tee /etc/dconf/db/local.d/98-force-animations > /dev/null <<'DCONF_EOF'
          [org/gnome/shell]
          enabled-extensions=['force-animations@software-rendering']
          DCONF_EOF

          if ! sudo grep -qs '^system-db:local' /etc/dconf/profile/user 2>/dev/null; then
            printf 'user-db:user\nsystem-db:local\n' | sudo tee /etc/dconf/profile/user > /dev/null
          fi
          sudo dconf update > /dev/null 2>&1 || true

          # Fallback gsettings per-user untuk 'runner'.
          sudo -u runner dbus-run-session -- gsettings set org.gnome.shell enabled-extensions "['$UUID']" >> "$CI_LOG_DIR/appearance.log" 2>&1 || true
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.interface enable-animations true >> "$CI_LOG_DIR/appearance.log" 2>&1 || true
          sudo chown -R runner:runner /home/runner/.config || true

          ok "Extension terpasang: $UUID"
          ok "Animasi aktif via global.force_animations (slow-down 2.5×)"
          step_done


      # ------------------------------------------------------------------
      # 08 · SAFE-UPGRADE HELPER
      # Pengganti `sudo apt upgrade` yang memutus sesi CRD.
      # ------------------------------------------------------------------
      - name: Install Safe Upgrade Helper
        run: |
          source /tmp/ci-lib.sh
          step "08/11" "Install safe-upgrade helper"

          if [ ! -f "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" ]; then
            fail "scripts/safe-upgrade.sh tidak ditemukan (checkout gagal)"
            exit 1
          fi
          sudo cp "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" /usr/local/bin/safe-upgrade
          sudo chmod +x /usr/local/bin/safe-upgrade || true
          sudo ln -sf /usr/local/bin/safe-upgrade /usr/bin/safe-upgrade || true

          # Tanpa shortcut desktop (konsisten dengan gnome24.yml); cukup MOTD.
          echo 'Gunakan `safe-upgrade` sebagai pengganti `sudo apt upgrade` di sesi Chrome Remote Desktop.' \
            | sudo tee /etc/motd > /dev/null || true

          safe-upgrade --help > /dev/null 2>&1 || true
          ok "safe-upgrade terpasang: /usr/local/bin/safe-upgrade"
          step_done


      # ------------------------------------------------------------------
      # 09 · CRD PIN
      # Default 123456; ubah lewat GitHub Actions secret CRD_PIN.
      # ------------------------------------------------------------------
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          source /tmp/ci-lib.sh
          step "09/11" "Configure CRD PIN"

          if [ -n "$CUSTOM_CRD_PIN" ]; then
            CRD_PIN="$CUSTOM_CRD_PIN"
            PIN_SOURCE="secret"
          else
            CRD_PIN="123456"
            PIN_SOURCE="default"
          fi

          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            fail "CRD_PIN harus berisi minimal 6 digit angka"
            exit 1
          fi

          echo "::add-mask::$CRD_PIN"
          echo "CRD_PIN=$CRD_PIN" >> "$GITHUB_ENV"
          echo "CRD_PIN_SOURCE=$PIN_SOURCE" >> "$GITHUB_ENV"

          if [ "$PIN_SOURCE" = "secret" ]; then
            ok "PIN dikonfigurasi (secret CRD_PIN)"
          else
            ok "PIN dikonfigurasi (default, belum ada secret CRD_PIN)"
          fi
          step_done


      # ------------------------------------------------------------------
      # 10 · OTORISASI + REGISTRASI CRD
      #
      # Kode OAuth `--code=...` bersifat sekali pakai dan cepat kedaluwarsa,
      # sedangkan instalasi desktop memakan 20-40 menit. Karena itu setelah
      # desktop siap, step ini membuka form web lokal lewat Cloudflare quick
      # tunnel (tanpa akun); kode baru dibuat SETELAH URL muncul. Bila
      # registrasi gagal, kode baru dapat dikirim tanpa re-run.
      #
      # Keamanan: URL memakai token acak 128-bit, form hanya menerima perintah
      # `start-host` (allowlist karakter), bind ke 127.0.0.1, satu perintah
      # diproses pada satu waktu. Jangan bagikan URL.
      # ------------------------------------------------------------------
      - name: Authorize & Register Chrome Remote Desktop (Wayland BETA)
        env:
          FALLBACK_CMD: ${{ inputs.crd_host_command }}
        run: |
          source /tmp/ci-lib.sh
          step "10/11" "Authorize & register Chrome Remote Desktop"

          STATE_DIR=/tmp/crd-web-auth
          SERVER="$GITHUB_WORKSPACE/scripts/crd-web-auth.py"
          PORT=8787
          TIMEOUT_MINUTES=30
          RUNNER_UID=$(id -u runner)

          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          if [ ! -f "$SERVER" ]; then
            fail "scripts/crd-web-auth.py tidak ditemukan (checkout gagal)"
            exit 1
          fi

          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"

          CRD_WEB_TOKEN="$(openssl rand -hex 16)"
          export CRD_WEB_STATE="$STATE_DIR"
          export CRD_WEB_PORT="$PORT"
          export CRD_WEB_TOKEN
          TOKEN="$CRD_WEB_TOKEN"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))

          python3 "$SERVER" set-status waiting \
            "Menunggu perintah Chrome Remote Desktop..." --deadline "$DEADLINE"

          python3 "$SERVER" > "$STATE_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          sleep 1
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            fail "Server form gagal dijalankan"
            cat "$STATE_DIR/server.log" || true
            exit 1
          fi
          ok "Form server aktif di 127.0.0.1:$PORT"

          # cloudflared biasanya sudah diunduh di background pada step 02.
          CLOUDFLARED=/tmp/cloudflared
          if [ ! -x "$CLOUDFLARED" ]; then
            run_quiet "Unduh cloudflared" \
              curl -fsSL --retry 3 --retry-delay 2 -o "$CLOUDFLARED" \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x "$CLOUDFLARED"
          fi

          TUNNEL_LOG="$STATE_DIR/tunnel.log"
          TUNNEL_PID=""
          PUBLIC_URL=""
          TUNNEL_RESTARTS=0

          start_tunnel() {
            local proto="${1:-}"
            : > "$TUNNEL_LOG"
            if [ -n "$proto" ]; then
              nohup "$CLOUDFLARED" tunnel --no-autoupdate --protocol "$proto" \
                --url "http://127.0.0.1:$PORT" >> "$TUNNEL_LOG" 2>&1 &
            else
              nohup "$CLOUDFLARED" tunnel --no-autoupdate \
                --url "http://127.0.0.1:$PORT" >> "$TUNNEL_LOG" 2>&1 &
            fi
            TUNNEL_PID=$!
            PUBLIC_URL=""
            local _i
            for _i in {1..30}; do
              PUBLIC_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n1 || true)"
              if [ -n "$PUBLIC_URL" ]; then
                return 0
              fi
              kill -0 "$TUNNEL_PID" 2>/dev/null || return 1
              sleep 1
            done
            return 1
          }

          stop_process() {
            local pid="$1"
            local _i
            [ -z "$pid" ] && return 0
            kill "$pid" 2>/dev/null || true
            for _i in {1..10}; do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.1
            done
            kill -9 "$pid" 2>/dev/null || true
          }

          cleanup_tunnel() {
            stop_process "$TUNNEL_PID"
          }

          cleanup() {
            cleanup_tunnel
            stop_process "$SERVER_PID"
          }
          trap cleanup EXIT

          announce_url() {
            local url="$1"
            echo ""
            ok "Form otorisasi siap · berlaku ${TIMEOUT_MINUTES} menit"
            kv "URL" "${url}/${TOKEN}/"
            echo ""
            echo "    1. Buka URL di atas (error Cloudflare? tunggu ~15 detik lalu refresh)."
            echo "    2. Buka https://remotedesktop.google.com/headless -> Begin -> Next -> Authorize."
            echo "    3. Salin perintah \"Debian Linux\", tempel di form, lalu submit."
            echo ""
            echo "::notice title=CRD Authorization::Buka ${url}/${TOKEN}/ lalu tempel perintah Chrome Remote Desktop."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## 🔐 Otorisasi Chrome Remote Desktop"
                echo ""
                echo "Desktop sudah siap. Buka URL berikut, lalu tempel perintah dari"
                echo "<https://remotedesktop.google.com/headless> (berlaku ±${TIMEOUT_MINUTES} menit):"
                echo ""
                echo "**<${url}/${TOKEN}/>**"
                echo ""
                echo "_Jika muncul error Cloudflare (1033/502), tunggu ~15 detik lalu refresh._"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          register_command() {
            local cmd="$1"
            local attempt rc
            local clean

            # Bersihkan input dan buang --name lama; device selalu bernama "gnome".
            clean="$(printf '%s' "$cmd" | tr -d '\r' | sed -E 's/--name=("[^"]*"|[^ ]*)//g' | sed 's/[[:space:]]*$//')"
            echo "::add-mask::$clean"

            if ! printf '%s' "$clean" | grep -q 'start-host'; then
              fail "Perintah tidak mengandung 'start-host'"
              return 1
            fi
            # Defense in depth: server sudah memvalidasi, tetapi perintah
            # dieksekusi lewat `bash -c`.
            if printf '%s' "$clean" | grep -qE '\\|\$\(|`|;|&|\||>|<'; then
              fail "Perintah mengandung karakter yang tidak diizinkan"
              return 1
            fi
            clean="$clean --name=\"gnome\""

            # RQ_NOCMD: command line (berisi kode OAuth + PIN) tidak ditulis ke log.
            rc=1
            for attempt in 1 2 3; do
              python3 "$SERVER" set-status registering \
                "Mendaftarkan perangkat... (percobaan ${attempt}/3)" --attempts "$attempt" || true
              if RQ_SOFT=1 RQ_NOCMD=1 run_quiet "Registrasi perangkat (percobaan ${attempt}/3)" \
                   sudo -u runner env CRD_PIN="$CRD_PIN" bash -c "$clean --pin=\"$CRD_PIN\""; then
                rc=0
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                info "Kode mungkin kedaluwarsa/terpakai atau error transien · coba lagi dalam $((attempt * 5))s"
                sleep $((attempt * 5))
              fi
            done
            return "$rc"
          }

          RESULT=""

          if ! start_tunnel; then
            warn "Tunnel QUIC gagal · mencoba http2"
            cleanup_tunnel
            start_tunnel http2 || true
          fi

          if [ -z "$PUBLIC_URL" ]; then
            fail "Cloudflare quick tunnel tidak dapat dibuat"
            tail -n 40 "$TUNNEL_LOG" || true

            # Fallback opsional: input crd_host_command dari workflow_dispatch.
            if [ -n "$FALLBACK_CMD" ]; then
              info "Menggunakan crd_host_command sebagai fallback"
              if register_command "$FALLBACK_CMD"; then
                RESULT=success
              fi
            fi

            if [ "$RESULT" != "success" ]; then
              python3 "$SERVER" set-status failed \
                "Tunnel gagal dibuat. Jalankan ulang workflow." \
                --error "cloudflared tidak menghasilkan URL publik" || true
              fail "Tidak ada form web maupun fallback command yang berhasil"
              exit 1
            fi
          else
            announce_url "$PUBLIC_URL"
            info "Menunggu perintah dari form (maks. ${TIMEOUT_MINUTES} menit)"

            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              # Cek ringan tanpa spawn proses Python tiap 2 detik.
              if grep -q '"state": "success"' "$STATE_DIR/status.json" 2>/dev/null; then
                RESULT=success
                break
              fi

              if [ -f "$STATE_DIR/command" ]; then
                if mv "$STATE_DIR/command" "$STATE_DIR/command.processing" 2>/dev/null; then
                  SUBMITTED="$(cat "$STATE_DIR/command.processing" 2>/dev/null || true)"
                  ok "Perintah diterima dari form"
                  if register_command "$SUBMITTED"; then
                    rm -f "$STATE_DIR/command.processing"
                    RESULT=success
                    break
                  fi
                  rm -f "$STATE_DIR/command.processing"
                  python3 "$SERVER" set-status failed \
                    "Registrasi gagal. Ambil kode BARU di halaman headless lalu submit lagi." \
                    --error "Kode OAuth kemungkinan sudah terpakai/kedaluwarsa, atau error jaringan. Detail ada di log workflow." || true
                  warn "Registrasi gagal · menunggu kode baru dari form (tanpa re-run)"
                fi
              fi

              # Restart tunnel bila cloudflared mati (URL publik akan berubah).
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                TUNNEL_RESTARTS=$((TUNNEL_RESTARTS + 1))
                warn "Tunnel berhenti · restart ${TUNNEL_RESTARTS}/3"
                if [ "$TUNNEL_RESTARTS" -gt 3 ] || ! start_tunnel; then
                  python3 "$SERVER" set-status failed \
                    "Tunnel bermasalah. Jalankan ulang workflow." \
                    --error "cloudflared berhenti berulang kali" || true
                  fail "Tunnel tidak dapat dipertahankan"
                  exit 1
                fi
                announce_url "$PUBLIC_URL"
              fi

              sleep 2
            done

            if [ "$RESULT" != "success" ]; then
              python3 "$SERVER" set-status failed \
                "Waktu tunggu ${TIMEOUT_MINUTES} menit habis. Jalankan ulang workflow." \
                --error "Tidak ada perintah valid yang diterima" || true
              fail "Tidak ada perintah dari form dalam ${TIMEOUT_MINUTES} menit · jalankan ulang workflow (cache .deb mempercepat re-run)"
              exit 1
            fi
          fi

          ok "Perangkat terdaftar"

          # `start-host` mencoba `systemctl enable --now` lewat sudo/pkexec,
          # tetapi tanpa TTY (stdin = /dev/null) dapat gagal senyap. Pastikan
          # service aktif agar device langsung bisa di-connect.
          sudo systemctl enable chrome-remote-desktop@runner >/dev/null 2>&1 || true
          sudo systemctl start chrome-remote-desktop@runner >/dev/null 2>&1 || true
          sleep 2
          if ! systemctl is-active --quiet chrome-remote-desktop@runner; then
            fail "chrome-remote-desktop@runner tidak aktif"
            systemctl status chrome-remote-desktop@runner --no-pager || true
            sudo journalctl -u chrome-remote-desktop@runner -n 150 --no-pager || true
            # Kirim status gagal saat tunnel masih hidup agar browser menerimanya.
            python3 "$SERVER" set-status failed \
              "Service CRD tidak aktif. Lihat log workflow (Wayland BETA)." \
              --error "chrome-remote-desktop@runner inactive" || true
            exit 1
          fi
          ok "Service chrome-remote-desktop@runner aktif"

          # Kirim status success SAAT tunnel masih hidup, lalu beri jeda agar
          # polling browser (2-10 dtk + warm-up tunnel) sempat menerimanya.
          python3 "$SERVER" set-status success \
            "Berhasil! Buka https://remotedesktop.google.com/access dan pilih device 'gnome'." || true
          sleep 20
          cleanup_tunnel
          info "Form otorisasi ditutup"

          # Pastikan GNOME Shell benar-benar menjadi compositor Wayland headless;
          # tanpa WAYLAND_DISPLAY di systemd user env, CRD tidak dapat men-stream desktop.
          WAYLAND_READY=0
          WAYLAND_SOCKET=""
          for i in {1..45}; do
            WAYLAND_SOCKET="$(as_runner systemctl --user show-environment 2>/dev/null | sed -n 's/^WAYLAND_DISPLAY=//p' | head -n1)"
            if [ -n "$WAYLAND_SOCKET" ] && [ -S "/run/user/$RUNNER_UID/$WAYLAND_SOCKET" ]; then
              WAYLAND_READY=1
              break
            fi
            sleep 2
          done

          if [ "$WAYLAND_READY" -ne 1 ]; then
            fail "Compositor Wayland tidak siap dalam ~90 detik (gejala umum mode BETA: shell headless / portal / PipeWire)"
            echo "::group::Debug · chrome-remote-desktop@runner"
            systemctl status chrome-remote-desktop@runner --no-pager || true
            sudo journalctl -u chrome-remote-desktop@runner -n 200 --no-pager || true
            echo "::endgroup::"
            echo "::group::Debug · GNOME Shell user service"
            as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager || true
            as_runner journalctl --user -n 200 --no-pager || true
            echo "::endgroup::"
            echo "::group::Debug · proses & runtime"
            pgrep -a -x gnome-shell || true
            pgrep -a -x gnome-session || true
            pgrep -a chrome-remote || true
            ls -la "/run/user/$RUNNER_UID" | head -n 40 || true
            echo "::endgroup::"
            # Status "success" sudah terkirim ke browser sebelum tunnel ditutup;
            # jangan menimpanya dengan "failed".
            if [ "$(python3 "$SERVER" get-state)" != "success" ]; then
              python3 "$SERVER" set-status failed \
                "GNOME Wayland gagal start. Workflow BETA ini belum berhasil di runner." \
                --error "WAYLAND_DISPLAY tidak muncul / socket tidak ada" || true
            fi
            exit 1
          fi

          ok "Compositor Wayland aktif ($WAYLAND_SOCKET)"
          {
            as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager || true
            pgrep -a -x gnome-shell || true
            pgrep -a -x gnome-session || true
            sudo journalctl -u chrome-remote-desktop@runner -n 40 --no-pager || true
          } > "$CI_LOG_DIR/crd-ready-detail.log" 2>&1 || true

          echo ""
          ok "Chrome Remote Desktop siap (Wayland BETA)"
          kv "Akses" "https://remotedesktop.google.com/access"
          kv "Perangkat" "gnome"
          kv "Pengguna" "runner"
          kv "PIN" "default 123456, atau secret CRD_PIN"
          echo "::notice::CRD siap - connect lewat https://remotedesktop.google.com/access (device: gnome, user: runner)"
          step_done


      # ------------------------------------------------------------------
      # 11 · VERIFY
      # Output sukses ringkas; diagnostik lengkap hanya dicetak bila gagal
      # (selalu disimpan di /tmp/ci-logs/verify-details.log).
      # ------------------------------------------------------------------
      - name: Verify Installation
        run: |
          source /tmp/ci-lib.sh
          step "11/11" "Verify installation"

          RUNNER_UID=$(id -u runner)
          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }
          gs_get() { sudo -u runner dbus-run-session -- gsettings get "$@" 2>/dev/null | tr -d "'" || true; }

          DETAIL="$CI_LOG_DIR/verify-details.log"
          {
            echo "## system";            uname -a
            echo "## gnome-shell";       gnome-shell --version
            echo "## CRD unit";          systemctl cat chrome-remote-desktop@runner 2>/dev/null | tail -n 40
            echo "## headless override"; cat /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf
            echo "## user environment";  as_runner systemctl --user show-environment 2>/dev/null | grep -E 'WAYLAND_DISPLAY|XDG_SESSION_TYPE|XDG_CURRENT_DESKTOP|XDG_SESSION_DESKTOP'
            echo "## shell status";      as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager 2>/dev/null
            echo "## shell journal";     as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 40 --no-pager 2>/dev/null
            echo "## CRD status";        systemctl status chrome-remote-desktop@runner --no-pager
            echo "## extension";         ls -l /usr/share/gnome-shell/extensions/force-animations@software-rendering/
            echo "## kvm";               ls -l /dev/kvm; getent group kvm libvirt
            echo "## opencode";          dpkg -l | grep -i opencode
          } > "$DETAIL" 2>&1 || true

          verify_fail() {
            fail "$1"
            echo "::group::Diagnostik"
            tail -n 150 "$DETAIL" || true
            echo "::endgroup::"
            exit 1
          }

          # --- Wayland + CRD ---
          if [ -e /home/runner/.chrome-remote-desktop-session ]; then
            warn ".chrome-remote-desktop-session masih ada (tidak dipakai mode Wayland)"
          fi
          WAYLAND_DISPLAY_VALUE=$(as_runner systemctl --user show-environment 2>/dev/null | sed -n 's/^WAYLAND_DISPLAY=//p')
          if [ -z "$WAYLAND_DISPLAY_VALUE" ]; then
            verify_fail "WAYLAND_DISPLAY belum diekspor ke systemd user environment"
          fi
          if [ ! -S "/run/user/$RUNNER_UID/$WAYLAND_DISPLAY_VALUE" ]; then
            verify_fail "Socket Wayland tidak ada: /run/user/$RUNNER_UID/$WAYLAND_DISPLAY_VALUE"
          fi
          ok "Compositor Wayland aktif ($WAYLAND_DISPLAY_VALUE)"

          if systemctl is-active --quiet chrome-remote-desktop@runner; then
            ok "Service chrome-remote-desktop@runner aktif"
          else
            verify_fail "chrome-remote-desktop@runner tidak aktif"
          fi

          if grep -q -- "--headless" /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf 2>/dev/null &&
             grep -q -- "--virtual-monitor 1280x720" /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf 2>/dev/null; then
            ok "Headless + virtual monitor 1280x720"
          else
            warn "Override headless / virtual monitor tidak sesuai"
          fi

          # --- Lock & animasi ---
          if [ -f /etc/dconf/db/local.d/99-crd-no-lock ]; then
            ok "Lock / screensaver / suspend dinonaktifkan"
          else
            warn "99-crd-no-lock tidak ditemukan"
          fi
          if sudo -u runner dbus-run-session -- gsettings get org.gnome.shell enabled-extensions 2>/dev/null | grep -q 'force-animations@software-rendering'; then
            ok "force-animations terdaftar (animasi aktif pada software rendering)"
          else
            warn "force-animations TIDAK terdaftar di enabled-extensions"
          fi

          # --- Tampilan (vanilla Ubuntu · dark mode) ---
          if ls -d /home/runner/.themes/catppuccin* /home/runner/.icons/catppuccin* > /dev/null 2>&1; then
            verify_fail "Masih ada sisa aset Catppuccin"
          fi
          if [ -n "$(ls -A /home/runner/Desktop 2>/dev/null)" ]; then
            verify_fail "Desktop tidak kosong"
          fi

          COLOR_SCHEME="$(gs_get org.gnome.desktop.interface color-scheme)"
          [ "$COLOR_SCHEME" = "prefer-dark" ] || verify_fail "color-scheme bukan prefer-dark (dapat: ${COLOR_SCHEME:-kosong})"
          GTK_THEME_VAL="$(gs_get org.gnome.desktop.interface gtk-theme)"
          case "$GTK_THEME_VAL" in
            *Yaru-dark*) ;;
            *) verify_fail "gtk-theme bukan Yaru-dark (dapat: ${GTK_THEME_VAL:-kosong})" ;;
          esac

          # CRD memaksa XDG_CURRENT_DESKTOP=GNOME, jadi override
          # [org.gnome.desktop.background:ubuntu] tidak berlaku; nilai di-set
          # eksplisit oleh dconf 96-crd-ubuntu-look. Bila file gambar tidak
          # ada, shell hanya menggambar primary-color.
          EXPECT_LIGHT='file:///usr/share/backgrounds/warty-final-ubuntu.png'
          EXPECT_DARK='file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
          check_wallpaper() {
            local key="$1" want="$2" got path
            got="$(gs_get org.gnome.desktop.background "$key")"
            if [ "$got" != "$want" ]; then
              verify_fail "$key bukan wallpaper Ubuntu yang diharapkan (diharapkan: $want, dapat: ${got:-kosong})"
            fi
            path="${got#file://}"
            if [ ! -f "$path" ]; then
              verify_fail "File wallpaper tidak ada: $path (layar hanya akan menampilkan primary-color)"
            fi
          }
          check_wallpaper picture-uri "$EXPECT_LIGHT"
          check_wallpaper picture-uri-dark "$EXPECT_DARK"

          for pair in "icon-theme:Yaru" "cursor-theme:Yaru" "font-name:Ubuntu Sans 11"; do
            key="${pair%%:*}"
            want="${pair#*:}"
            got="$(gs_get org.gnome.desktop.interface "$key")"
            [ "$got" = "$want" ] || verify_fail "$key bukan default Ubuntu yang diharapkan ($want, dapat: ${got:-kosong})"
          done
          ok "Tampilan: Ubuntu default · dark mode (Yaru-dark) · wallpaper · desktop bersih"

          # --- Sistem & aplikasi ---
          if [ "$(cat /etc/timezone 2>/dev/null)" = "Asia/Jakarta" ] && [ "$(date +%z)" = "+0700" ]; then
            ok "Timezone WIB (Asia/Jakarta, +0700)"
          else
            warn "Timezone bukan Asia/Jakarta"
          fi
          command -v safe-upgrade > /dev/null || warn "safe-upgrade tidak ditemukan"
          ok "Aplikasi: Chrome $(google-chrome --version 2>/dev/null | awk '{print $3}') · VS Code $(code --version 2>/dev/null | head -n 1) · OpenCode $(opencode --version 2>/dev/null)"

          # --- KVM & virtualisasi ---
          if sudo -u runner test -r /dev/kvm && sudo -u runner test -w /dev/kvm; then
            ok "runner dapat mengakses /dev/kvm"
          else
            warn "runner tidak dapat mengakses /dev/kvm (instalasi tetap OK; KVM nonaktif di runner ini)"
          fi
          for bin in qemu-system-x86_64 virsh virt-manager gnome-boxes; do
            command -v "$bin" > /dev/null || warn "$bin tidak ditemukan"
          done

          # --- Snap ---
          if command -v snap >/dev/null 2>&1; then warn "snap masih terpasang"; fi
          if dpkg -l thunderbird 2>/dev/null | grep -q ^ii; then warn "thunderbird (transisi snap) masih terpasang"; fi
          if apt-mark showhold | grep -qx snapd; then
            ok "snap / snapd dihapus dan di-hold"
          else
            warn "snapd tidak di-hold"
          fi

          step_done


      # ------------------------------------------------------------------
      # DESKTOP PROOF · bukti render + diagnostik layar hitam
      #
      # Memisahkan "compositor tidak merender" dari "stream CRD/PipeWire mati":
      #   - rekam 4 detik via org.gnome.Shell.Screencast (jalur berbeda dari
      #     stream CRD), simpan PNG + webm sebagai artifact;
      #   - simpan link PipeWire gnome-shell -> chrome-remote-desktop-host
      #     beserta format yang diiklankan, dan error journal shell.
      # Detail hanya dicetak ke log Actions bila ada anomali.
      # ------------------------------------------------------------------
      - name: Capture desktop proof (diagnostik)
        if: always()
        run: |
          source /tmp/ci-lib.sh
          step "DIAG" "Capture desktop proof"

          RUNNER_UID=$(id -u runner)
          OUT_DIR="${GITHUB_WORKSPACE:-/tmp}"
          WEBM="$OUT_DIR/desktop-proof.webm"
          PNG="$OUT_DIR/desktop-proof.png"
          rm -f "$WEBM" "$PNG"
          PROOF_OK=1

          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          PWLOG="$CI_LOG_DIR/proof-pipewire.log"
          {
            as_runner env PIPEWIRE_REMOTE=crd_audio/pipewire pw-link -l || true
            as_runner env PIPEWIRE_REMOTE=crd_audio/pipewire pw-dump > /tmp/pw-dump.json 2>/dev/null || true
            python3 - /tmp/pw-dump.json <<'PYPROOF' || true
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              print("pw-dump tidak tersedia:", exc)
              sys.exit(0)
          for obj in data:
              if obj.get("type") != "PipeWire:Interface:Node":
                  continue
              info = obj.get("info", {})
              name = info.get("props", {}).get("node.name", "")
              if name not in ("gnome-shell", "chrome-remote-desktop-host"):
                  continue
              print("node", name, "id", obj.get("id"))
              for fmt in info.get("params", {}).get("EnumFormat", [])[:4]:
                  keys = ("mediaType", "format", "size", "colorPrimaries", "transferFunction")
                  print("  ", {k: fmt[k] for k in keys if k in fmt})
          PYPROOF
          } > "$PWLOG" 2>&1 || true

          if as_runner gdbus call --session \
               --dest org.gnome.Shell.Screencast \
               --object-path /org/gnome/Shell/Screencast \
               --method org.gnome.Shell.Screencast.Screencast \
               "$WEBM" "{}" > /tmp/screencast.out 2>&1; then
            sleep 4
            as_runner gdbus call --session \
              --dest org.gnome.Shell.Screencast \
              --object-path /org/gnome/Shell/Screencast \
              --method org.gnome.Shell.Screencast.StopScreencast > /dev/null 2>&1 || true
            ok "Rekaman 4 detik dibuat ($(stat -c%s "$WEBM" 2>/dev/null || echo 0) byte)"
          else
            echo "::warning::Screencast D-Bus gagal: $(tail -n1 /tmp/screencast.out 2>/dev/null)"
            PROOF_OK=0
          fi

          if [ -s "$WEBM" ]; then
            gst-launch-1.0 -q filesrc location="$WEBM" ! decodebin ! videoconvert ! pngenc ! filesink location="$PNG" > /tmp/gst.out 2>&1 || true
          fi

          cat > /tmp/brightness.py <<'PYBR'
          import sys
          try:
              from gi.repository import GdkPixbuf
          except Exception as exc:
              print("GdkPixbuf tidak tersedia:", exc)
              sys.exit(0)
          pb = GdkPixbuf.Pixbuf.new_from_file(sys.argv[1])
          width, height = pb.get_width(), pb.get_height()
          pixels = pb.get_pixels()
          rowstride = pb.get_rowstride()
          channels = pb.get_n_channels()
          total = 0
          count = 0
          peak = 0
          for y in range(0, height, 16):
              for x in range(0, width, 16):
                  idx = y * rowstride + x * channels
                  r, g, b = pixels[idx], pixels[idx + 1], pixels[idx + 2]
                  total += r + g + b
                  count += 1
                  peak = max(peak, r, g, b)
          avg = total / (count * 3) if count else 0
          print(f"{width}x{height}, brightness rata-rata {avg:.1f}, puncak {peak}")
          sys.exit(3 if avg < 5 else 0)
          PYBR

          if [ -f "$PNG" ]; then
            BR_RC=0
            BRIGHT="$(python3 /tmp/brightness.py "$PNG" 2>&1)" || BR_RC=$?
            if [ "$BR_RC" -eq 3 ]; then
              warn "Frame hampir hitam: $BRIGHT"
              echo "::warning::Frame hampir hitam - compositor tidak merender atau pemandangan memang gelap."
              PROOF_OK=0
            else
              ok "Frame desktop: $BRIGHT"
            fi
          else
            echo "::warning::Tidak ada frame yang berhasil diekstrak (compositor/PipeWire bermasalah)."
            PROOF_OK=0
          fi

          CRASH_DIR="/run/user/$RUNNER_UID/crd_crashpad/completed"
          if find "$CRASH_DIR" -maxdepth 1 -name '*.dmp' 2>/dev/null | grep -q .; then
            mkdir -p "$OUT_DIR/crash-dumps"
            find "$CRASH_DIR" -maxdepth 1 -name '*.dmp' -exec cp {} "$OUT_DIR/crash-dumps/" \; 2>/dev/null || true
            warn "Crash dump disalin: $(find "$OUT_DIR/crash-dumps" -name '*.dmp' | wc -l) file"
            PROOF_OK=0
          fi

          JLOG="$CI_LOG_DIR/proof-shell-journal.log"
          as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 200 --no-pager 2>/dev/null \
            | grep -iE "pipewire|screencast|error|crash" | tail -n 15 > "$JLOG" || true

          # Detail hanya dicetak bila ada anomali.
          if [ "$PROOF_OK" -ne 1 ]; then
            echo "::group::PipeWire graph (gnome-shell vs host CRD)"
            cat "$PWLOG" || true
            echo "::endgroup::"
            echo "::group::Journal shell (error / screencast / pipewire)"
            cat "$JLOG" || true
            echo "::endgroup::"
          fi
          step_done

      - name: Upload desktop proof (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-proof-${{ github.run_id }}
          path: |
            desktop-proof.png
            desktop-proof.webm
            crash-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 3


      # ------------------------------------------------------------------
      # JOB SUMMARY · tabel status + durasi per step, info akses, versi.
      # Ditulis sebelum Keep Alive agar langsung terlihat di tab Summary.
      # ------------------------------------------------------------------
      - name: Publish job summary
        if: always()
        run: |
          export GNOME_V="$(gnome-shell --version 2>/dev/null || true)"
          export CHROME_V="$(google-chrome --version 2>/dev/null || true)"
          export CODE_V="$(code --version 2>/dev/null | head -n 1 || true)"
          export OC_V="$(opencode --version 2>/dev/null || true)"
          export CRD_V="$(dpkg-query -W -f='${Version}' chrome-remote-desktop 2>/dev/null || true)"
          python3 - <<'PYSUM'
          import os, time

          steps, order = {}, []
          try:
              for line in open('/tmp/ci-steps.tsv'):
                  p = line.rstrip('\n').split('\t')
                  if p[0] == 'S' and len(p) >= 4:
                      steps[p[1]] = {'title': p[2], 'dur': None}
                      order.append(p[1])
                  elif p[0] == 'D' and len(p) >= 3 and p[1] in steps:
                      steps[p[1]]['dur'] = int(p[2])
          except FileNotFoundError:
              pass

          def fmt(s):
              s = int(s)
              return f"{s // 60}m{s % 60:02d}s" if s >= 60 else f"{s}s"

          failed = [i for i in order if steps[i]['dur'] is None]
          start = os.environ.get('JOB_START_EPOCH', '')
          total = fmt(time.time() - int(start)) if start.isdigit() else '-'

          out = ['## 🖥️ GNOME 26 + Chrome Remote Desktop (Wayland BETA)', '']
          if failed:
              out.append(f"❌ **Gagal / terhenti** di step `{failed[0]}` · {steps[failed[0]]['title']}. "
                         "Log lengkap tersedia di artifact `install-logs-<run id>`.")
          else:
              out.append(f"✅ **Siap digunakan** · total {total}")
          out += ['', '| Step | Status | Durasi |', '|---|:---:|---:|']
          for i in order:
              s = steps[i]
              done = s['dur'] is not None
              out.append(f"| {i} · {s['title']} | {'✅' if done else '❌'} | {fmt(s['dur']) if done else '-'} |")

          if not failed:
              pin = ('secret `CRD_PIN`' if os.environ.get('CRD_PIN_SOURCE') == 'secret'
                     else 'default `123456` (belum ada secret `CRD_PIN`)')
              out += ['', '### Akses', '',
                      '- URL: https://remotedesktop.google.com/access',
                      '- Perangkat: `gnome` · Pengguna: `runner`',
                      f'- PIN: {pin}']
              vers = [('GNOME Shell', 'GNOME_V'), ('Chrome', 'CHROME_V'), ('VS Code', 'CODE_V'),
                      ('OpenCode', 'OC_V'), ('Chrome Remote Desktop', 'CRD_V')]
              out += ['', '### Versi terpasang', '', '| Komponen | Versi |', '|---|---|']
              for name, key in vers:
                  out.append(f"| {name} | {os.environ.get(key) or '-'} |")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('\n'.join(out) + '\n')
          PYSUM


      # ------------------------------------------------------------------
      # KEEP ALIVE · monitor sesi + diagnostik Wayland
      #
      #   1. Pemeriksaan tiap 5 menit: status host CRD, PID + status gnome-shell
      #      (compositor headless), portal, dan error journal yang relevan.
      #      Heartbeat dicetak tiap 30 menit, atau segera bila ada insiden.
      #   2. Deteksi insiden: PID gnome-shell berubah (crash + respawn),
      #      service tidak aktif, dump crash host baru, serta gnome-shell/Xvfb
      #      di luar unit systemd (indikasi CRD memulai sesi X sendiri).
      #   3. Auto-restart hanya untuk chrome-remote-desktop@runner (maks. 1x
      #      per 2 menit); gnome-shell tidak di-restart agar bukti crash tetap ada.
      # Sisa waktu dihitung dari JOB_START_EPOCH agar tidak menabrak timeout 360 menit.
      # ------------------------------------------------------------------
      - name: Keep Alive
        run: |
          source /tmp/ci-lib.sh

          RUNNER_UID=$(id -u runner)
          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          JOB_START="${JOB_START_EPOCH:-$(date +%s)}"
          JOB_LIMIT=$(( 360 * 60 ))   # samakan dengan timeout-minutes
          GRACE=60                    # ruang untuk cleanup job
          INTERVAL=300                # pemeriksaan kesehatan tiap 5 menit
          HEARTBEAT_EVERY=6           # heartbeat tiap 6 siklus (30 menit)
          RESTART_MIN_GAP=120         # jeda minimum antar restart host
          HOST_RESTARTS=0
          SHELL_MISS=0
          CYCLE=0
          LAST_HOST_RESTART=0
          LAST_SHELL_PID=""
          LAST_EXTRA_PIDS=""
          XVFB_REPORTED=0
          CRASH_DIR="/run/user/$RUNNER_UID/crd_crashpad/completed"
          LAST_CRASH_COUNT="$(find "$CRASH_DIR" -maxdepth 1 -name '*.dmp' 2>/dev/null | wc -l | tr -d ' ')"

          get_shell_pid() {
            as_runner systemctl --user show -p MainPID --value org.gnome.Shell@ubuntu.service 2>/dev/null || true
          }

          # Semua instans gnome-shell selain Main PID unit, plus jejak Xvfb.
          # Xwayland sengaja tidak dihitung (normal untuk app X11 di Wayland).
          collect_extra_processes() {
            EXTRA_PIDS=""
            EXTRA_COUNT=0
            for p in $(pgrep -x gnome-shell 2>/dev/null || true); do
              [ "$p" = "$1" ] && continue
              EXTRA_PIDS="$EXTRA_PIDS $p"
              EXTRA_COUNT=$(( EXTRA_COUNT + 1 ))
            done
            X_PROCS="$(pgrep -a -x 'Xvfb' 2>/dev/null || true)"
          }

          step "LIVE" "Session monitor"
          ok "Chrome Remote Desktop berjalan (Wayland BETA)"
          kv "Akses" "https://remotedesktop.google.com/access"
          kv "Pengguna" "runner"
          kv "Monitor" "cek tiap $(( INTERVAL / 60 )) menit · heartbeat tiap $(( INTERVAL * HEARTBEAT_EVERY / 60 )) menit"
          warn "Jangan batalkan workflow selama sesi digunakan"

          # Konfigurasi host CRD (nama file memakai hash: host#<hash>.json).
          # Berguna bila versi CRD baru berhenti menghormati flag Wayland.
          HOST_JSON="$(ls -1 /home/runner/.config/chrome-remote-desktop/host*.json 2>/dev/null | head -n 1 || true)"
          echo "::group::Konfigurasi host CRD"
          if [ -n "$HOST_JSON" ] && [ -f "$HOST_JSON" ]; then
            kv "Config" "$(basename "$HOST_JSON")"
            kv "Keys" "$(grep -oE '"[a-zA-Z_]+":' "$HOST_JSON" | tr -d '\":' | tr '\n' ' ' || true)"
            grep -oE '"[a-zA-Z_]*(wayland|experimental|x_session|display)[a-zA-Z_]*": ?[^,}]+' "$HOST_JSON" | sed 's/^/      /' || echo "      (tidak ada key wayland/experimental/x_session/display)"
            kv "Versi CRD" "$(dpkg-query -W -f='${Version}' chrome-remote-desktop 2>/dev/null || echo '?')"
          else
            info "host*.json tidak ditemukan di /home/runner/.config/chrome-remote-desktop/"
          fi
          echo "::endgroup::"

          while :; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - JOB_START ))
            REMAIN=$(( JOB_LIMIT - GRACE - ELAPSED ))
            INCIDENT=0

            if [ "$REMAIN" -le 0 ]; then
              info "Batas job tercapai (elapsed $(( ELAPSED / 60 )) menit) · monitor berakhir"
              break
            fi

            # ---- 1. Snapshot komponen sesi ----
            if systemctl is-active --quiet chrome-remote-desktop@runner 2>/dev/null; then
              HOST_STATE="active"
            else
              HOST_STATE="inactive"
            fi
            SHELL_STATE="$(as_runner systemctl --user is-active org.gnome.Shell@ubuntu.service 2>/dev/null || echo unknown)"
            SHELL_PID="$(get_shell_pid)"
            PORTAL_STATE="$(as_runner systemctl --user is-active xdg-desktop-portal-gnome.service 2>/dev/null || echo unknown)"

            # ---- 2. gnome-shell PID berubah (crash + respawn) ----
            if [ -n "$LAST_SHELL_PID" ] && [ -n "$SHELL_PID" ] && [ "$SHELL_PID" != "$LAST_SHELL_PID" ]; then
              INCIDENT=1
              echo "::warning::GNOME Shell restart di tengah sesi (PID ${LAST_SHELL_PID} -> ${SHELL_PID}); gejala layar hitam + kursor."
              warn "gnome-shell PID berubah: ${LAST_SHELL_PID} → ${SHELL_PID}"
              echo "::group::Insiden · journal org.gnome.Shell@ubuntu.service (60 baris terakhir)"
              as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 60 --no-pager || true
              echo "::endgroup::"
              SHELL_MISS=0
            fi
            LAST_SHELL_PID="$SHELL_PID"

            # ---- 2b. Crash host CRD (dump baru di crashpad) ----
            # Host dapat crash walau service tetap "active"; client hanya
            # melihat layar hitam. Dump baru -> restart host (rate-limited).
            HOST_RESTARTED=""
            CRASH_COUNT="$(find "$CRASH_DIR" -maxdepth 1 -name '*.dmp' 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${CRASH_COUNT:-0}" -gt "${LAST_CRASH_COUNT:-0}" ]; then
              INCIDENT=1
              echo "::warning::Crash host CRD terdeteksi (dump ${LAST_CRASH_COUNT} -> ${CRASH_COUNT})."
              warn "Host CRD crash · client dapat melihat layar hitam"
              ls -lt "$CRASH_DIR" 2>/dev/null | head -n 5 || true
              echo "::group::Insiden · journal chrome-remote-desktop@runner (80 baris terakhir)"
              sudo journalctl -u chrome-remote-desktop@runner -n 80 --no-pager 2>/dev/null || true
              echo "::endgroup::"
              if [ $(( NOW - LAST_HOST_RESTART )) -ge "$RESTART_MIN_GAP" ]; then
                HOST_RESTARTS=$(( HOST_RESTARTS + 1 ))
                LAST_HOST_RESTART=$NOW
                info "Restart host CRD setelah crash (ke-${HOST_RESTARTS})"
                sudo systemctl restart chrome-remote-desktop@runner 2>/dev/null || \
                  sudo systemctl start chrome-remote-desktop@runner 2>/dev/null || true
                sleep 5
                HOST_RESTARTED=1
              fi
            fi
            LAST_CRASH_COUNT="$CRASH_COUNT"

            if [ "$SHELL_STATE" != "active" ]; then
              INCIDENT=1
              SHELL_MISS=$(( SHELL_MISS + 1 ))
              warn "org.gnome.Shell@ubuntu.service tidak aktif (${SHELL_MISS}x berturut-turut) · capture akan hitam"
              if [ "$SHELL_MISS" -le 1 ]; then
                echo "::group::Insiden · status + journal gnome-shell"
                as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager || true
                as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 60 --no-pager || true
                echo "::endgroup::"
              fi
            else
              SHELL_MISS=0
            fi

            # ---- 3. Auto-restart HANYA host CRD (bukan shell) ----
            if [ "$HOST_STATE" != "active" ]; then
              INCIDENT=1
              warn "chrome-remote-desktop@runner tidak aktif"
              if [ $(( NOW - LAST_HOST_RESTART )) -ge "$RESTART_MIN_GAP" ]; then
                HOST_RESTARTS=$(( HOST_RESTARTS + 1 ))
                LAST_HOST_RESTART=$NOW
                info "Restart chrome-remote-desktop@runner (ke-${HOST_RESTARTS})"
                sudo systemctl restart chrome-remote-desktop@runner 2>/dev/null || \
                  sudo systemctl start chrome-remote-desktop@runner 2>/dev/null || true
                sleep 5
                HOST_RESTARTED=1
              else
                info "Restart terakhir baru saja terjadi · menunggu siklus berikutnya"
              fi
            fi

            # ---- 4. Status pasca (potensi) restart ----
            if systemctl is-active --quiet chrome-remote-desktop@runner 2>/dev/null; then
              HOST_NOW="active${HOST_RESTARTED:+ (baru di-restart)}"
            else
              HOST_NOW="inactive"
              INCIDENT=1
              warn "Host CRD masih tidak aktif · coba lagi pada siklus berikutnya"
            fi

            # ---- 4b. gnome-shell / X di LUAR unit systemd ----
            # Indikasi daemon CRD memulai sesi X sendiri (anak proses CRD);
            # parentage dibongkar agar sumbernya terlihat. Dilaporkan hanya
            # saat daftar PID berubah.
            collect_extra_processes "$SHELL_PID"
            if [ "$EXTRA_COUNT" -gt 0 ]; then
              if [ "$EXTRA_PIDS " != "$LAST_EXTRA_PIDS " ]; then
                INCIDENT=1
                warn "gnome-shell ${EXTRA_COUNT}x di luar unit systemd (unit=$SHELL_PID):${EXTRA_PIDS:-}"
                echo "::group::Insiden · gnome-shell ekstra (parentage + args)"
                for p in $EXTRA_PIDS; do
                  PPID_X="$(ps -o ppid= -p "$p" 2>/dev/null | tr -d ' ')"
                  echo "  shell PID ${p} (parent ${PPID_X:-?}):"
                  ps -o pid,ppid,comm,args -p "$p" --no-headers 2>/dev/null | sed 's/^/      /'
                  if [ -n "$PPID_X" ] && [ "$PPID_X" != "1" ]; then
                    echo "    parent ${PPID_X}:"
                    ps -o pid,ppid,comm,args -p "$PPID_X" --no-headers 2>/dev/null | sed 's/^/        /'
                  fi
                done
                echo "::endgroup::"
                LAST_EXTRA_PIDS="$EXTRA_PIDS"
              fi
            else
              LAST_EXTRA_PIDS=""
            fi
            if [ -n "$X_PROCS" ] && [ "$XVFB_REPORTED" -eq 0 ]; then
              INCIDENT=1
              XVFB_REPORTED=1
              warn "Xvfb aktif (sesi X legacy, bukan Wayland headless):"
              printf '%s\n' "$X_PROCS" | sed 's/^/      /'
            fi

            # ---- 5. Journal error ringkas ----
            JOURNAL_ERRORS="$(as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 200 --no-pager --since "-$(( INTERVAL / 60 ))min" 2>/dev/null | grep -iE "error|segfault|crash|abort|screencast" | tail -n 5 || true)"
            if [ -n "$JOURNAL_ERRORS" ]; then
              INCIDENT=1
              warn "Journal shell ($(( INTERVAL / 60 )) menit terakhir):"
              printf '%s\n' "$JOURNAL_ERRORS" | sed 's/^/      /'
            fi

            # ---- 5b. Journal host CRD (system journal) ----
            CRD_JOURNAL="$(sudo journalctl -u chrome-remote-desktop@runner -n 60 --no-pager --since "-$(( INTERVAL / 60 ))min" 2>/dev/null | grep -iE 'session|wayland|display|x11|xvfb|fail|error' | tail -n 8 || true)"
            if [ -n "$CRD_JOURNAL" ]; then
              INCIDENT=1
              warn "Journal host CRD ($(( INTERVAL / 60 )) menit terakhir):"
              printf '%s\n' "$CRD_JOURNAL" | sed 's/^/      /'
            fi

            # ---- 6. Heartbeat: tiap 30 menit, atau segera saat ada insiden ----
            if [ "$INCIDENT" -eq 1 ] || [ $(( CYCLE % HEARTBEAT_EVERY )) -eq 0 ]; then
              printf '  %s%s%s  up %sm · sisa ~%sm · host %s · shell %s (pid %s) · portal %s · extra-shell %sx · restart %sx\n' \
                "$C_D" "$(date +%H:%M)" "$C_N" \
                "$(( ELAPSED / 60 ))" "$(( REMAIN / 60 ))" "$HOST_NOW" \
                "$SHELL_STATE" "${SHELL_PID:-?}" "$PORTAL_STATE" "$EXTRA_COUNT" "$HOST_RESTARTS"
            fi
            CYCLE=$(( CYCLE + 1 ))

            # ---- 7. Tidur satu interval (tidak melebihi sisa waktu) ----
            SLEEP_NOW="$INTERVAL"
            if [ "$SLEEP_NOW" -gt "$REMAIN" ]; then
              SLEEP_NOW="$REMAIN"
            fi
            sleep "$SLEEP_NOW"
          done

          echo ""
          ok "Sesi CRD dijaga sampai akhir batas job"
          kv "Restart host" "${HOST_RESTARTS}x"
          kv "Akses" "https://remotedesktop.google.com/access (user: runner)"

      # Log lengkap proses install/konfigurasi; hanya diunggah bila job gagal.
      # Diletakkan paling akhir agar juga menangkap kegagalan di step mana pun
      # (step setelah yang gagal dilewati, kecuali yang `if: always()`).
      - name: Upload install logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ github.run_id }}
          path: /tmp/ci-logs/
          if-no-files-found: ignore
          retention-days: 3
