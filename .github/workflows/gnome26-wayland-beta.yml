name: GNOME 26 + CRD (Wayland BETA)

# ==============================================================================
#  RICH LINUX · GNOME 50 (Ubuntu 26.04) + Chrome Remote Desktop · Wayland
# ------------------------------------------------------------------------------
#  Status   : Terverifikasi 7 Nov 2026 (AV1 ±60 fps, audio PipeWire, input EI,
#             animasi aktif). Mode Wayland CRD masih eksperimental di upstream
#             dan dapat berubah antar versi CRD / Mutter / PipeWire.
#             Untuk jalur X11 yang stabil, gunakan gnome24.yml (Ubuntu 24.04).
#  Detail   : docs/wayland-crd.md
#
#  Cara pakai (dari fork sendiri)
#    1. Fork repo, aktifkan Actions.
#    2. (Opsional) Buat secret CRD_PIN (min. 6 digit). Default: 123456.
#    3. Actions -> "GNOME 26 + CRD (Wayland BETA)" -> Run workflow (±20-40 menit).
#    4. Setelah desktop siap, buka URL form otorisasi yang tampil di log
#       (Cloudflare quick tunnel).
#    5. Buka https://remotedesktop.google.com/headless -> Authorize -> salin
#       perintah "Debian Linux" -> tempel ke form -> submit.
#    6. Connect lewat https://remotedesktop.google.com/access (device "gnome").
#
#  Tentang log
#    - Proses install/unduh berjalan "senyap": log tampil sebagai satu baris
#      per tugas (✔ label + durasi). Log lengkap disimpan di /tmp/ci-logs.
#    - Saat sebuah tugas gagal, 80 baris terakhirnya langsung dicetak, dan
#      seluruh log diunggah sebagai artifact `install-logs-<run id>`
#      (hanya bila job gagal).
#    - Tab Summary berisi tabel status + durasi tiap step dan info akses.
#
#  Catatan
#    - Input `crd_host_command` hanya fallback bila tunnel gagal dibuat.
#    - Layar blank setelah connect: tunggu 1-2 menit lalu reconnect; watchdog
#      me-restart host otomatis saat mendeteksi crash.
#    - Jangan jalankan dua run bersamaan (device "gnome" bisa duplikat).
#    - Batas job GitHub-hosted 6 jam, sehingga sesi hidup ±6 jam per run.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "OPSIONAL (fallback): perintah CRD. Normalnya kosongkan - form web muncul setelah desktop siap."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for scripts/)
        uses: actions/checkout@v4

      - id: dated
        run: echo "today=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      # Helper logging bersama; di-source oleh setiap step berikutnya.
      #   run_quiet "label" cmd...  -> jalankan senyap, log ke /tmp/ci-logs,
      #                                tampilkan satu baris hasil (+ durasi).
      #   Variabel opsional: RQ_SOFT=1 (gagal = peringatan, bukan error),
      #                      RQ_NOCMD=1 (jangan tulis command line ke log).
      # CATATAN: fungsi yang diberikan ke run_quiet berjalan dalam konteks `||`,
      # sehingga `set -e` tidak aktif di dalamnya; gunakan `|| return 1` eksplisit.
      - name: Initialize logging helpers
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/01-initialize-logging-helpers.sh"

      # Cache .deb: restore di awal, save terpisah (`if: always()`) sebelum
      # step registrasi, supaya re-run setelah kegagalan tidak mengunduh ulang.
      - name: Restore apt package cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}
          restore-keys: |
            apt-ubuntu-2604-

      # ------------------------------------------------------------------
      # 01 · PREPARE SYSTEM
      # Semua repo pihak ketiga (VS Code, Chrome, CRD) ditambahkan di sini
      # agar cukup SATU `apt-get update` untuk seluruh workflow.
      # ------------------------------------------------------------------
      - name: Prepare System
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/02-prepare-system.sh"

      # ------------------------------------------------------------------
      # 02 · DESKTOP + APLIKASI (SATU TRANSAKSI APT)
      # GNOME, Chrome, VS Code, dan CRD dipasang dalam satu transaksi.
      # Selama itu, .deb OpenCode Desktop dan cloudflared diunduh di background.
      # ------------------------------------------------------------------
      - name: Install Desktop & Applications
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/03-install-desktop-applications.sh"

      # ------------------------------------------------------------------
      # 03 · REMOTE USER
      # ------------------------------------------------------------------
      - name: Setup Remote User
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/04-setup-remote-user.sh"

      # ------------------------------------------------------------------
      # 04 · OPENCODE (CLI + DESKTOP)
      # ------------------------------------------------------------------
      - name: Install OpenCode
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/05-install-opencode.sh"

      # Salin arsip .deb sebelum registrasi; bila step registrasi gagal,
      # re-run tidak perlu mengunduh ulang.
      - name: Sync apt cache for GitHub save
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/06-sync-apt-cache-for-github-save.sh"

      # `if: always()` menyimpan cache walau step sebelumnya gagal. Diletakkan
      # sebelum registrasi agar tidak hilang bila job kena timeout saat Keep Alive.
      # `continue-on-error`: key hari ini yang sudah ada tidak bisa ditimpa.
      - name: Save apt package cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}


      # ------------------------------------------------------------------
      # 05 · GNOME WAYLAND SESSION (BETA)
      # Ubuntu 26.04 / GNOME 50 hanya mendukung Wayland, sedangkan CRD stabil
      # masih X11. Beta ini memakai mode Wayland eksperimental CRD + GNOME
      # Shell headless dengan virtual monitor (tanpa Xorg/Xvfb).
      # ------------------------------------------------------------------
      - name: Configure GNOME Wayland Session (BETA)
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/07-configure-gnome-wayland-session-beta.sh"

      # ------------------------------------------------------------------
      # 06 · SCREENSAVER / LOCK / TAMPILAN
      # Mencegah GNOME mengunci/mematikan layar yang memutus sesi CRD, dan
      # menetapkan tampilan default Ubuntu (dark mode).
      # ------------------------------------------------------------------
      - name: Disable Screensaver and Lock
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/08-disable-screensaver-and-lock.sh"

      # ------------------------------------------------------------------
      # 07 · ANIMASI PADA SOFTWARE RENDERING
      #
      # Sesi headless tanpa GPU membuat Mutter melaporkan rendering non-
      # hardware, sehingga GNOME Shell memanggil St.Settings.inhibit_animations()
      # dan menimpa enable-animations. Satu-satunya override resmi adalah
      # global.force_animations, yang hanya dapat di-set dari dalam shell
      # (extension). Ref: GNOME Shell js/ui/main.js (AnimationsSettings).
      # ------------------------------------------------------------------
      - name: Enable GNOME Shell Animations (software rendering fix)
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/09-enable-gnome-shell-animations-software-rendering-fix.sh"

      # ------------------------------------------------------------------
      # 08 · SAFE-UPGRADE HELPER
      # Pengganti `sudo apt upgrade` yang memutus sesi CRD.
      # ------------------------------------------------------------------
      - name: Install Safe Upgrade Helper
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/10-install-safe-upgrade-helper.sh"

      # ------------------------------------------------------------------
      # 09 · CRD PIN
      # Default 123456; ubah lewat GitHub Actions secret CRD_PIN.
      # ------------------------------------------------------------------
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/11-configure-crd-pin.sh"

      # ------------------------------------------------------------------
      # 10 · OTORISASI + REGISTRASI CRD
      #
      # Kode OAuth `--code=...` bersifat sekali pakai dan cepat kedaluwarsa,
      # sedangkan instalasi desktop memakan 20-40 menit. Karena itu setelah
      # desktop siap, step ini membuka form web lokal lewat Cloudflare quick
      # tunnel (tanpa akun); kode baru dibuat SETELAH URL muncul. Bila
      # registrasi gagal, kode baru dapat dikirim tanpa re-run.
      #
      # Keamanan: URL memakai token acak 128-bit, form hanya menerima perintah
      # `start-host` (allowlist karakter), bind ke 127.0.0.1, satu perintah
      # diproses pada satu waktu. Jangan bagikan URL.
      # ------------------------------------------------------------------
      - name: Authorize & Register Chrome Remote Desktop (Wayland BETA)
        env:
          FALLBACK_CMD: ${{ inputs.crd_host_command }}
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/12-authorize-register-chrome-remote-desktop-wayland-beta.sh"

      # ------------------------------------------------------------------
      # 11 · VERIFY
      # Output sukses ringkas; diagnostik lengkap hanya dicetak bila gagal
      # (selalu disimpan di /tmp/ci-logs/verify-details.log).
      # ------------------------------------------------------------------
      - name: Verify Installation
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/13-verify-installation.sh"

      # ------------------------------------------------------------------
      # DESKTOP PROOF · bukti render + diagnostik layar hitam
      #
      # Memisahkan "compositor tidak merender" dari "stream CRD/PipeWire mati":
      #   - rekam 4 detik via org.gnome.Shell.Screencast (jalur berbeda dari
      #     stream CRD), simpan PNG + webm sebagai artifact;
      #   - simpan link PipeWire gnome-shell -> chrome-remote-desktop-host
      #     beserta format yang diiklankan, dan error journal shell.
      # Detail hanya dicetak ke log Actions bila ada anomali.
      # ------------------------------------------------------------------
      - name: Capture desktop proof (diagnostik)
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/14-capture-desktop-proof-diagnostik.sh"

      - name: Upload desktop proof (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-proof-${{ github.run_id }}
          path: |
            desktop-proof.png
            desktop-proof.webm
            crash-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 3


      # ------------------------------------------------------------------
      # JOB SUMMARY · tabel status + durasi per step, info akses, versi.
      # Ditulis sebelum Keep Alive agar langsung terlihat di tab Summary.
      # ------------------------------------------------------------------
      - name: Publish job summary
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/15-publish-job-summary.sh"

      # ------------------------------------------------------------------
      # KEEP ALIVE · monitor sesi + diagnostik Wayland
      #
      #   1. Pemeriksaan tiap 5 menit: status host CRD, PID + status gnome-shell
      #      (compositor headless), portal, dan error journal yang relevan.
      #      Heartbeat dicetak tiap 30 menit, atau segera bila ada insiden.
      #   2. Deteksi insiden: PID gnome-shell berubah (crash + respawn),
      #      service tidak aktif, dump crash host baru, serta gnome-shell/Xvfb
      #      di luar unit systemd (indikasi CRD memulai sesi X sendiri).
      #   3. Auto-restart hanya untuk chrome-remote-desktop@runner (maks. 1x
      #      per 2 menit); gnome-shell tidak di-restart agar bukti crash tetap ada.
      # Sisa waktu dihitung dari JOB_START_EPOCH agar tidak menabrak timeout 360 menit.
      # ------------------------------------------------------------------
      - name: Keep Alive
        run: bash "$GITHUB_WORKSPACE/scripts/wayland/16-keep-alive.sh"

      # Log lengkap proses install/konfigurasi; hanya diunggah bila job gagal.
      # Diletakkan paling akhir agar juga menangkap kegagalan di step mana pun
      # (step setelah yang gagal dilewati, kecuali yang `if: always()`).
      - name: Upload install logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ github.run_id }}
          path: /tmp/ci-logs/
          if-no-files-found: ignore
          retention-days: 3
