name: GNOME 26 + CRD (Wayland BETA)

# ============================================================================
#  RICH LINUX - GNOME 50 + Chrome Remote Desktop (WAYLAND BETA)
# ============================================================================
#  ⚠️  STATUS: BETA / EKSPERIMENTAL — JANGAN DIPAKAI SEBAGAI SATU-SATUNYA
#      WORKFLOW PRODUKSI. Gunakan gnome.yml (Ubuntu 24.04) jika butuh
#      jalur X11 yang sudah terbukti. gnome26.yml adalah percobaan X11
#      lama yang TIDAK bisa jalan di GNOME 50 (Wayland-only).
#
#  Workflow ini mencoba menjalankan GNOME Shell 50 (Ubuntu 26.04) sebagai
#  sesi Wayland headless, lalu menyambungkannya ke Chrome Remote Desktop
#  memakai mode Wayland eksperimental CRD 155+:
#      CHROME_REMOTE_DESKTOP_USE_WAYLAND=GNOME
#
#  Kenapa terpisah? Ubuntu 26.04 / GNOME 50 sudah TIDAK mendukung sesi X11.
#  CRD versi stabil masih default ke X11, jadi mode Wayland ini masih
#  eksperimental dan bisa gagal tergantung versi CRD, Mutter, portal, dan
#  kondisi runner. Workflow ini sengaja memisahkan eksperimen dari
#  gnome26.yml agar jalur utama tidak ikut rusak.
#
#  CARA PAKAI (dari fork Anda sendiri):
#    1. Fork repo ini, aktifkan Actions.
#    2. (Opsional) Set secret CRD_PIN (min. 6 digit). Default: 123456.
#    3. Tab Actions -> "GNOME 26 + CRD (Wayland BETA)" -> Run workflow.
#    4. Tunggu ~20-40 menit. Workflow menampilkan URL form otorisasi
#       (Cloudflare quick tunnel) setelah desktop siap.
#    5. Buka URL, buka https://remotedesktop.google.com/headless di tab lain,
#       Authorize, copy perintah "Debian Linux", paste ke form, submit.
#    6. Connect ke https://remotedesktop.google.com/access (device "gnome").
#
#  Input `crd_host_command` tetap ada sebagai FALLBACK opsional kalau tunnel
#  gagal dibuat. Normalnya biarkan kosong.
#
#  CATATAN BETA:
#    - Jika langkah "Verify Installation" gagal, baca log journal yang
#      dicetak. Biasanya masalah ada di GNOME Shell headless / portal /
#      PipeWire, bukan di kode auth.
#    - Jangan buka dua run bersamaan: device "gnome" bisa duplikat.
#    - Job GitHub-hosted maksimum 6 jam, jadi sesi hidup ~6 jam per run.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "OPSIONAL (fallback): paste perintah CRD. Normalnya biarkan kosong - form web muncul setelah desktop siap."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for scripts/)
        uses: actions/checkout@v4

      - id: dated
        run: echo "today=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      # CATATAN: `actions/cache@v4` dengan input `save-always` sudah DEPRECATED
      # dan tidak berfungsi sesuai niat (lihat action.yml resmi: "save-always
      # does not work as intended and will be removed in a future release").
      # Padahal save-always justru penting di sini: cache .deb harus tetap
      # tersimpan walau STEP 17 (register CRD) gagal, supaya re-run berikutnya
      # tidak mengunduh ulang ~GB. Solusi resmi: pisah restore + save, dan
      # save pakai `if: always()` (lihat step "Save apt package cache").
      - name: Restore apt package cache (re-run cepat, tak unduh ulang ~GB)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}
          restore-keys: |
            apt-ubuntu-2604-

      # ============================================================
      # PREPARE SYSTEM
      # ============================================================
      - name: Prepare System
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 01/19] PREPARE SYSTEM${C_NC}"
          echo "------------------------------------------------------------"

          # Simpan waktu mulai job. Dipakai STEP 19 (Keep Alive) untuk menghitung
          # sisa waktu, supaya sleep tidak menabrak timeout job 360 menit.
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          # ============================================================
          # TIMEZONE -> ASIA/JAKARTA (WIB, UTC+7)
          #
          # Runner GitHub default-nya UTC, jadi jam di GNOME/CRD meleset 7 jam
          # dari waktu Indonesia. Di-set sedini mungkin di step ini supaya
          # semua log, timestamp file, dan jam desktop sesi CRD langsung WIB.
          #
          # Catatan penting: `timedatectl set-timezone` memperbarui
          # /etc/localtime + state systemd, TAPI TIDAK memperbarui
          # /etc/timezone. Tool lama (dpkg/tzdata dsb.) membaca /etc/timezone,
          # jadi keduanya harus disamakan supaya tidak "balik" ke UTC.
          # ============================================================
          TZ_TARGET="Asia/Jakarta"

          echo -e "${C_YELLOW}[INFO] Setting timezone to $TZ_TARGET (WIB, UTC+7)...${C_NC}"

          if [ ! -e "/usr/share/zoneinfo/$TZ_TARGET" ]; then
            echo -e "${C_RED}[FAIL] zoneinfo $TZ_TARGET tidak tersedia.${C_NC}"
            exit 1
          fi

          # 1) Cara utama (systemd). Gagal pun tidak masalah -> ada fallback.
          sudo timedatectl set-timezone "$TZ_TARGET" 2>/dev/null || true

          # 2) Fallback/jaminan: /etc/timezone + symlink /etc/localtime
          #    (cara ini juga benar untuk environment tanpa systemd).
          echo "$TZ_TARGET" | sudo tee /etc/timezone > /dev/null
          sudo ln -sf "/usr/share/zoneinfo/$TZ_TARGET" /etc/localtime

          # 3) Sinkronkan metadata debconf tzdata agar tidak ditanya lagi dan
          #    tidak kembali ke UTC saat package tzdata di-upgrade nanti.
          sudo DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive tzdata > /dev/null 2>&1 || true

          # 4) Tegaskan ulang symlink sesudah reconfigure, lalu verifikasi.
          sudo ln -sf "/usr/share/zoneinfo/$TZ_TARGET" /etc/localtime
          if [ "$(cat /etc/timezone 2>/dev/null)" != "$TZ_TARGET" ] || [ "$(date +%z)" != "+0700" ]; then
            echo -e "${C_RED}[FAIL] timezone tidak ter-set ke $TZ_TARGET.${C_NC}"
            cat /etc/timezone || true
            ls -l /etc/localtime || true
            date || true
            exit 1
          fi
          echo -e "${C_GREEN}[OK] Timezone: $(date +'%Z %z') | $(date)${C_NC}"

          __prepare_start=$(date +%s)

          echo -e "${C_YELLOW}[INFO] Disabling needrestart entirely (no noisy logs, no auto-restart)...${C_NC}"
          # Matikan apt hook needrestart SEBELUM operasi apt apa pun, supaya
          # setiap install/upgrade tidak menampilkan 'Scanning processes...'
          # dan tidak mencoba me-restart service (yang bisa memutus sesi CRD).
          # Di Ubuntu 24.04/26.04 hook asli needrestart ada di 99needrestart
          # (memanggil /usr/lib/needrestart/apt-pinvoke), bukan 20needrestart
          # (nama legacy 22.04). Hapus keduanya supaya tidak ada banner
          # "Scanning processes..." setelah setiap apt install/upgrade,
          # termasuk dari terminal sesi CRD.
          sudo rm -f /etc/apt/apt.conf.d/99needrestart || true
          sudo rm -f /etc/apt/apt.conf.d/20needrestart || true
          sudo mkdir -p /etc/needrestart/needrestart.conf.d || true
          echo '$nrconf{restart} = '"'"'l'"'"';' | sudo tee /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null
          echo '$nrconf{kernelhints} = 0;' | sudo tee -a /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null
          echo '$nrconf{check} = 0;' | sudo tee -a /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null

          echo -e "${C_YELLOW}[INFO] Tuning apt for speed (retries, pipelining, minimal index languages)...${C_NC}"
          sudo tee /etc/apt/apt.conf.d/99-speed > /dev/null <<'APTEOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::http::Pipeline-Depth "10";
          Acquire::Languages "none";
          APTEOF

          # Pakai .deb dari cache GitHub (jika ada) agar upgrade/install
          # tidak mengunduh ulang (hemat ~GB saat re-run setelah gagal register).
          echo -e "${C_YELLOW}[INFO] Seeding /var/cache/apt/archives from GitHub apt cache...${C_NC}"
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -a /home/runner/apt-archives/. /var/cache/apt/archives/ 2>/dev/null || true

          echo -e "${C_YELLOW}[INFO] Updating package lists...${C_NC}"
          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Removing unnecessary packages...${C_NC}"
          sudo apt-get remove -y --purge \
            man-db \
            firewalld \
            ufw \
            || true

          sudo apt-get autoremove -y || true

          # Hapus snapd + paket transisi snap SEBELUM upgrade. Image runner
          # Ubuntu membawa firefox/snapd; upgrade paket transisi firefox bisa
          # memicu "Installing the firefox snap" dan menunggu snap store lama.
          # Hold mencegah paket ini ikut terpasang lagi oleh apt berikutnya.
          echo -e "${C_YELLOW}[INFO] Removing snapd + snap transitional packages before upgrade...${C_NC}"
          sudo systemctl stop snapd.service snapd.socket 2>/dev/null || true
          sudo apt-get purge -y snapd thunderbird firefox || true
          sudo apt-mark hold snapd thunderbird firefox
          sudo rm -rf /snap /var/snap /var/lib/snapd /root/snap /home/runner/snap 2>/dev/null || true
          command -v snap >/dev/null 2>&1 && echo -e "${C_YELLOW}[WARN] snap masih ada sebelum upgrade.${C_NC}" || echo -e "${C_GREEN}[OK] snapd dihapus sebelum upgrade.${C_NC}"

          # Full upgrade di BUILD-TIME (aman, sebelum CRD/session jalan).
          # Jangan `apt upgrade` manual dari dalam sesi CRD — itu me-restart
          # chrome-remote-desktop/gnome-shell/systemd dan memutus sesi.
          # Untuk upgrade dari dalam sesi, pakai `safe-upgrade` (scripts/safe-upgrade.sh).
          echo -e "${C_YELLOW}[INFO] Full upgrade at build-time (fast unpack, no dpkg fsync)...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get upgrade -y \
            -o Dpkg::Options::="--force-unsafe-io" \
            -o Dpkg::Use-Pty=0

          __prepare_end=$(date +%s)
          echo -e "${C_GREEN}[OK] System prepared. (Elapsed: $((__prepare_end-__prepare_start))s)${C_NC}"


      # ============================================================
      # INSTALL GNOME
      # ============================================================
      - name: Install GNOME Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          export NEEDRESTART_SUSPEND=1

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 02/19] INSTALL GNOME DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Installing full GNOME desktop (approx 2GB, please wait)...${C_NC}"

          # Slim font: metapackage fonts-noto merekomendasikan font raksasa
          # (fonts-noto-cjk 61MB, cjk-extra 145MB, extra 78.5MB) yang tidak
          # dibutuhkan desktop. Pin negative membuat apt melewatinya
          # (safe: hanya Recommends, bukan Depends). Pin dihapus lagi setelah
          # install agar install font di sesi CRD nanti tetap normal.
          sudo tee /etc/apt/preferences.d/99-no-noto-heavy > /dev/null <<'PREFE'
          Package: fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-extra
          Pin: version *
          Pin-Priority: -1
          PREFE

          # Blokir snapd + deb transisi (thunderbird/firefox -> snap). Ketiganya
          # hanya Recommends (bukan Depends) dari ubuntu-desktop, jadi aman
          # di-skip. thunderbird transisi memaksa 'snap install thunderbird' +
          # retry 30 menit ke store saat postinst (hang lama di runner). Pin
          # dihapus lagi setelah install agar operasi apt lain normal.
          sudo tee /etc/apt/preferences.d/99-no-snap.pref > /dev/null <<'PREFE'
          Package: snapd thunderbird firefox
          Pin: version *
          Pin-Priority: -10
          PREFE

          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            ubuntu-desktop \
            ubuntu-desktop-minimal \
            ubuntu-session \
            gnome-session \
            gnome-shell \
            gnome-control-center \
            nautilus \
            gnome-terminal \
            dbus-x11 \
            dbus-user-session \
            x11-xserver-utils \
            xwayland \
            pipewire \
            pipewire-pulse \
            wireplumber \
            xdg-desktop-portal \
            xdg-desktop-portal-gnome \
            xorg \
            adwaita-icon-theme \
            fonts-cantarell \
            qemu-system-x86 \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-clients \
            virtinst \
            virt-manager \
            gnome-boxes

          sudo rm -f /etc/apt/preferences.d/99-no-snap.pref

          # Hapus permanen snapd + deb transisi thunderbird/firefox. Tidak ada
          # paket yang hard-Depends ke snapd di graph install ini (terverifikasi),
          # jadi aman. Hold mencegah re-install oleh operasi apt berikutnya.
          sudo apt-get purge -y snapd thunderbird firefox || true
          sudo apt-mark hold snapd thunderbird firefox
          sudo rm -rf /snap /var/snap /var/lib/snapd /root/snap /home/runner/snap 2>/dev/null || true
          command -v snap >/dev/null 2>&1 && echo -e "${C_YELLOW}[WARN] snap masih ada.${C_NC}" || echo -e "${C_GREEN}[OK] snap dihapus permanen.${C_NC}"

          sudo rm -f /etc/apt/preferences.d/99-no-noto-heavy
          echo -e "${C_GREEN}[OK] Heavy Noto fonts (cjk / cjk-extra / extra) skipped (~285MB saved).${C_NC}"

          echo -e "${C_YELLOW}[INFO] Compiling GSettings schemas...${C_NC}"
          sudo glib-compile-schemas /usr/share/glib-2.0/schemas/ || true

          echo "------------------------------------------------------------"
          gnome-shell --version || true
          gnome-control-center --version || true
          ls /usr/share/xsessions/ubuntu.desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] GNOME installed: $(gnome-shell --version 2>/dev/null || echo 'version check skipped')${C_NC}"


      # ============================================================
      # CREATE REMOTE USER
      # ============================================================
      - name: Setup Remote User
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 03/19] SETUP REMOTE USER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Creating user 'runner'...${C_NC}"
          sudo useradd \
            -m \
            -s /bin/bash \
            runner || true

          echo "runner:root" | sudo chpasswd

          sudo usermod -aG sudo runner

          echo -e "${C_YELLOW}[INFO] Gibah akses KVM + libvirt ke runner...${C_NC}"
          # Runner x86 ubuntu-24.04 punya /dev/kvm, tapi default-nya hanya
          # dapat dibuka grup 'kvm' (crw-rw---- root:kvm). Pola resmi GitHub
          # adalah udev rule berikut (world-writable) supaya QEMU/virt-manager
          # tidak "permission denied" saat -enable-kvm. Aman kalau /dev/kvm
          # tidak ada (mis. ARM atau VM tanpa nested virtualization): udev
          # trigger hanya no-op.
          # Ref: https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo usermod -aG kvm runner || echo -e "${C_YELLOW}[WARN] group 'kvm' tidak ada di runner ini (KVM off).${C_NC}"
          sudo usermod -aG libvirt runner || true
          # Restart CRD daemon agar systemd re-init supplementary groups (kvm,
          # libvirt) dari /etc/group. Tanpa ini, daemon yang hidup SEBELUM usermod
          # mewariskan grup stale ke semua sesi -> virt-manager gagal di
          # libvirt-sock ("Permission denied") dan /dev/kvm tak terbaca.
          sudo systemctl restart chrome-remote-desktop@runner 2>/dev/null || true
          getent group kvm libvirt || true
          if sudo -u runner test -r /dev/kvm && sudo -u runner test -w /dev/kvm; then
            echo -e "${C_GREEN}[OK] runner dapat mengakses /dev/kvm (KVM enabled).${C_NC}"
          else
            echo -e "${C_YELLOW}[WARN] /dev/kvm belum bisa diakses runner (butuh re-login).${C_NC}"
          fi

          echo -e "${C_YELLOW}[INFO] Setting NEEDRESTART_MODE=l for runner (prevents service restart during apt)...${C_NC}"
          echo 'export NEEDRESTART_MODE=l' | sudo tee -a /home/runner/.bashrc > /dev/null
          echo 'export NEEDRESTART_SUSPEND=1' | sudo tee -a /home/runner/.bashrc > /dev/null

          sudo mkdir -p /home/runner/Desktop

          sudo chown -R runner:runner /home/runner

          echo -e "${C_GREEN}[OK] Remote user 'runner' created: $(id runner)${C_NC}"


      # ============================================================
      # INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 04/19] INSTALL GOOGLE CHROME${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading Google Chrome stable...${C_NC}"
          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/google-chrome.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" -o Dpkg::Use-Pty=0 /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          echo -e "${C_GREEN}[OK] Google Chrome installed: $(google-chrome --version)${C_NC}"


      # ============================================================
      # INSTALL VS CODE
      # ============================================================
      - name: Install VS Code
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 05/19] INSTALL VS CODE${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Adding Microsoft repository...${C_NC}"
          wget -qO- \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/packages.microsoft.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
            | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null

          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Installing VS Code...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" -o Dpkg::Use-Pty=0 code

          echo -e "${C_GREEN}[OK] VS Code installed: $(code --version | head -n 1)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE CLI
      # ============================================================
      - name: Install OpenCode CLI
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 06/19] INSTALL OPENCODE CLI${C_NC}"
          echo "------------------------------------------------------------"

          sudo apt-get update

          sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" -o Dpkg::Use-Pty=0 curl

          # NOTE: installer opencode.ai/v2/install mengabaikan
          # OPENCODE_INSTALL_DIR dan selalu install ke $HOME/.opencode/bin.
          # $GITHUB_PATH dari installer hanya berlaku untuk step berikutnya,
          # jadi export PATH manual untuk step yang sama.
          echo -e "${C_YELLOW}[INFO] Running official OpenCode installer...${C_NC}"
          curl -fsSL https://opencode.ai/v2/install | bash

          export PATH="$HOME/.opencode/bin:$PATH"

          # Salin system-wide agar tersedia untuk root + runner +
          # GNOME Terminal via CRD (yang tidak selalu load ~/.bashrc baru).
          sudo cp "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode || true
          sudo chmod +x /usr/local/bin/opencode || true

          echo -e "${C_GREEN}[OK] OpenCode CLI installed: $(opencode --version)${C_NC}"
          echo -e "${C_GREEN}[OK] Binary location: $(which opencode)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE DESKTOP
      # ============================================================
      - name: Install OpenCode Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 07/19] INSTALL OPENCODE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading OpenCode Desktop (.deb latest)...${C_NC}"
          wget -q https://opencode.ai/download/stable/linux-x64-deb \
            -O /tmp/opencode-desktop.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" -o Dpkg::Use-Pty=0 /tmp/opencode-desktop.deb

          rm -f /tmp/opencode-desktop.deb

          echo "------------------------------------------------------------"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          which opencode-desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] OpenCode Desktop installed.${C_NC}"


      # ============================================================
      # INSTALL CHROME REMOTE DESKTOP
      # ============================================================
      - name: Install Chrome Remote Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 08/19] INSTALL CHROME REMOTE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Adding Google CRD repository...${C_NC}"

          wget -qO- \
            https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/google-linux.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome-remote-desktop/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list > /dev/null

          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Installing chrome-remote-desktop...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            chrome-remote-desktop

          echo -e "${C_GREEN}[OK] Chrome Remote Desktop installed.${C_NC}"

      # Simpan arsip .deb ke cache GitHub SEKARANG (sebelum register) —
      # kalau STEP 16 gagal & user re-run, install tidak perlu unduh ulang.
      - name: Sync apt cache for GitHub save
        run: |
          sudo mkdir -p /home/runner/apt-archives
          sudo cp -a /var/cache/apt/archives/. /home/runner/apt-archives/ || true
          sudo chown -R runner:runner /home/runner/apt-archives || true

      # Simpan cache SEKARANG, saat .deb berukuran besar (GNOME, Chrome,
      # VS Code, OpenCode, Chrome Remote Desktop) sudah ada di
      # /var/cache/apt/archives. Diletakkan SEBELUM STEP 17 sengaja:
      # `if: always()` tetap menyimpan cache walau step sebelumnya gagal,
      # dan karena tidak ada di akhir job, cache tidak ikut hilang bila job
      # kena timeout 6 jam saat Keep Alive.
      # `continue-on-error`: kalau cache dengan key hari ini sudah ada (re-run
      # di tanggal yang sama), save tidak bisa menimpa key yang sama -> jangan
      # sampai menggagalkan job.
      - name: Save apt package cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2604-${{ steps.dated.outputs.today }}


      # ============================================================
      # CONFIGURE GNOME WAYLAND SESSION (BETA)
      # Ubuntu 26.04 = GNOME 50 yang Wayland-only. CRD stabil masih X11,
      # jadi beta ini memakai mode Wayland eksperimental CRD + GNOME Shell
      # headless dengan virtual monitor. Tidak ada Xorg/Xvfb.
      # ============================================================
      - name: Configure GNOME Wayland Session (BETA)
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 09/19] CONFIGURE GNOME WAYLAND SESSION (BETA)${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Memeriksa paket Wayland/GNOME...${C_NC}"
          test -x /usr/bin/gnome-session || { echo -e "${C_RED}[FAIL] /usr/bin/gnome-session missing.${C_NC}"; exit 1; }
          test -x /usr/bin/gnome-shell   || { echo -e "${C_RED}[FAIL] /usr/bin/gnome-shell missing.${C_NC}"; exit 1; }
          test -f /usr/share/gnome-session/sessions/ubuntu.session || {
            echo -e "${C_RED}[FAIL] ubuntu.session missing (paket ubuntu-session belum terpasang).${C_NC}"
            ls /usr/share/gnome-session/sessions/ || true
            exit 1
          }

          RUNNER_UID=$(id -u runner)
          echo -e "${C_YELLOW}[INFO] runner UID=$RUNNER_UID${C_NC}"

          # User manager + D-Bus session bus harus hidup supaya GNOME Shell
          # bisa jalan sebagai systemd user service dan mengekspor
          # WAYLAND_DISPLAY ke environment systemd user.
          sudo loginctl enable-linger runner || true
          sudo mkdir -p "/run/user/$RUNNER_UID"
          sudo chown runner:runner "/run/user/$RUNNER_UID"
          sudo chmod 700 "/run/user/$RUNNER_UID"

          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          echo -e "${C_YELLOW}[INFO] Menunggu systemd --user + D-Bus session bus milik runner...${C_NC}"
          for i in {1..30}; do
            if [ -S "/run/user/$RUNNER_UID/systemd/private" ] && [ -S "/run/user/$RUNNER_UID/bus" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -S "/run/user/$RUNNER_UID/systemd/private" ]; then
            echo -e "${C_RED}[FAIL] systemd --user runner tidak aktif.${C_NC}"
            sudo loginctl list-sessions || true
            exit 1
          fi
          if [ ! -S "/run/user/$RUNNER_UID/bus" ]; then
            echo -e "${C_RED}[FAIL] D-Bus session bus runner tidak ada: /run/user/$RUNNER_UID/bus${C_NC}"
            ls -la "/run/user/$RUNNER_UID" || true
            exit 1
          fi

          # Paksa environment user manager ke Wayland. Tanpa ini,
          # org.gnome.Shell@.service bisa menolak start karena
          # AssertEnvironment=XDG_SESSION_TYPE=wayland.
          as_runner systemctl --user set-environment \
            XDG_SESSION_TYPE=wayland \
            XDG_CURRENT_DESKTOP=GNOME \
            XDG_SESSION_DESKTOP=ubuntu
          as_runner systemctl --user unset-environment \
            WAYLAND_DISPLAY DISPLAY XAUTHORITY GNOME_SETUP_DISPLAY 2>/dev/null || true

          # CRD memanggil "gnome-session" tanpa argumen. Di Ubuntu 26.04
          # default session-name adalah "gnome", sedangkan mode GNOME Shell
          # yang tersedia hanya "ubuntu" (file /usr/share/gnome-shell/modes/ubuntu.json).
          # Wrapper ini memaksa sesi Ubuntu tanpa mengubah binary package.
          echo -e "${C_YELLOW}[INFO] Membuat wrapper gnome-session -> --session=ubuntu...${C_NC}"
          sudo tee /usr/local/bin/gnome-session > /dev/null <<'WRAP'
          #!/bin/sh
          exec /usr/bin/gnome-session --session=ubuntu "$@"
          WRAP
          sudo chmod 0755 /usr/local/bin/gnome-session

          # Jalur kedua (kalau CRD memanggil /usr/bin/gnome-session absolute):
          # set session-name ke ubuntu, bukan default "gnome" yang tidak punya
          # mode GNOME Shell di Ubuntu 26.04.
          sudo -u runner env HOME=/home/runner \
            dbus-run-session -- \
            gsettings set org.gnome.desktop.session session-name ubuntu || true

          # GNOME Shell 50 tidak punya backend X11. Untuk runner tanpa GPU,
          # jalankan shell sebagai compositor headless dengan satu virtual
          # monitor. Override ini berlaku untuk instance @ubuntu.
          echo -e "${C_YELLOW}[INFO] Menulis override GNOME Shell headless...${C_NC}"
          sudo mkdir -p /etc/systemd/user/org.gnome.Shell@.service.d
          sudo tee /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf > /dev/null <<'UNIT'
          [Service]
          ExecStart=
          ExecStart=/usr/bin/gnome-shell --mode=%i --wayland --headless --virtual-monitor 1920x1080
          UNIT

          # Mode Wayland CRD dipilih lewat environment service, bukan lewat
          # perintah start-host. Drop-in ini juga menyediakan bus address
          # yang dibutuhkan gnome-session (lihat crbug.com/432108529).
          echo -e "${C_YELLOW}[INFO] Menulis drop-in CRD Wayland...${C_NC}"
          sudo mkdir -p /etc/systemd/system/chrome-remote-desktop@.service.d
          sudo tee /etc/systemd/system/chrome-remote-desktop@.service.d/20-wayland-beta.conf > /dev/null <<UNIT
          [Service]
          Environment=CHROME_REMOTE_DESKTOP_USE_WAYLAND=GNOME
          Environment=XDG_SESSION_TYPE=wayland
          Environment=XDG_RUNTIME_DIR=/run/user/$RUNNER_UID
          Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$RUNNER_UID/bus
          Environment=LIBGL_ALWAYS_SOFTWARE=1
          Environment=MUTTER_DEBUG_FORCE_SOFTWARE_RENDER=1
          UNIT

          sudo systemctl daemon-reload
          as_runner systemctl --user daemon-reload

          # File sesi X11 lama tidak dipakai di mode Wayland dan bisa
          # membingungkan saat debugging. Autostart xrandr juga tidak relevan.
          sudo -u runner rm -f /home/runner/.chrome-remote-desktop-session
          sudo -u runner rm -f /home/runner/.config/autostart/set-resolution.desktop
          sudo rm -f /usr/local/bin/set-resolution.sh

          echo "------------------------------------------------------------"
          echo "--- CRD service drop-in ---"
          systemctl cat chrome-remote-desktop@runner.service | tail -n 20 || true
          echo "--- GNOME Shell user override ---"
          as_runner systemctl --user cat org.gnome.Shell@.service 2>/dev/null | tail -n 20 || true
          echo "--- systemd user environment ---"
          as_runner systemctl --user show-environment | grep -E '^(XDG|DBUS)' || true
          echo "------------------------------------------------------------"

          if ! as_runner systemctl --user show-environment | grep -q '^XDG_SESSION_TYPE=wayland$'; then
            echo -e "${C_RED}[FAIL] systemd user environment bukan wayland.${C_NC}"
            exit 1
          fi
          if ! systemctl cat chrome-remote-desktop@runner.service | grep -q 'CHROME_REMOTE_DESKTOP_USE_WAYLAND=GNOME'; then
            echo -e "${C_RED}[FAIL] Drop-in CRD Wayland tidak terbaca.${C_NC}"
            exit 1
          fi

          echo -e "${C_GREEN}[OK] Wayland session configured (BETA): GNOME Shell headless + CRD --enable-wayland.${C_NC}"


      # ============================================================
      # DISABLE SCREENSAVER + LOCK + SUSPEND (HEADLESS CRD)
      # Mencegah GNOME mengunci/mematikan layar dan memutus sesi CRD.
      # ============================================================
      - name: Disable Screensaver and Lock
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 10/19] DISABLE SCREENSAVER AND LOCK${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Disabling GNOME lock/suspend system-wide...${C_NC}"
          sudo mkdir -p /etc/dconf/db/local.d || true
          sudo tee /etc/dconf/db/local.d/99-crd-no-lock > /dev/null <<'EOF'
          [org/gnome/desktop/session]
          idle-delay=0
          [org/gnome/desktop/screensaver]
          lock-enabled=false
          idle-activation-enabled=false
          lock-delay=0
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-type='nothing'
          ambient-enabled=false
          EOF
          sudo dconf update || true

          # Fallback per-user gsettings (jalan saat sesi aktif; abaikan bila dbus belum ada).
          sudo -u runner dbus-launch --exit-with-session gsettings set org.gnome.desktop.screensaver lock-enabled false || true
          sudo -u runner dbus-launch --exit-with-session gsettings set org.gnome.desktop.screensaver idle-activation-enabled false || true
          sudo -u runner dbus-launch --exit-with-session gsettings set org.gnome.desktop.session idle-delay 0 || true
          sudo -u runner dbus-launch --exit-with-session gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing' || true
          sudo chown -R runner:runner /home/runner/.config || true

          echo -e "${C_GREEN}[OK] Screensaver, lock, and suspend disabled.${C_NC}"


      # ============================================================
      # ENABLE ANIMATIONS ON SOFTWARE RENDERING
      #
      # Sesi CRD Wayland BETA berjalan headless tanpa GPU, dan drop-in
      # memaksa LIBGL_ALWAYS_SOFTWARE=1, jadi Mutter SELALU melaporkan
      # is_rendering_hardware_accelerated() == false. GNOME Shell
      # (js/ui/main.js, class AnimationsSettings) lalu
      # memanggil St.Settings.inhibit_animations(), yang MENIMPA GSetting
      # org.gnome.desktop.interface enable-animations. Akibatnya semua
      # animasi (overview, minimize/maximize, workspace, dash) jadi instan
      # walaupun enable-animations=true dan sudah diubah via GNOME Tweaks.
      #
      # GNOME menyediakan override resmi untuk ini: global.force_animations
      # (properti Shell.Global yang writable, blurb aslinya "Force animations
      # to be enabled"). Tidak ada GSetting maupun environment variable untuk
      # itu, jadi satu-satunya cara adalah men-set-nya dari DALAM shell,
      # yaitu lewat GNOME Shell extension. Itulah yang dipasang di step ini.
      #
      # Referensi kode (GNOME Shell 46, main.js):
      #   _shouldEnableAnimations() {
      #       if (this._handles.size > 0) return false;
      #       if (global.force_animations) return true;
      #       if (!backend.is_rendering_hardware_accelerated()) return false;
      #       ...
      #   }
      # ============================================================
      - name: Enable GNOME Shell Animations (software rendering fix)
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 11/19] ENABLE ANIMATIONS ON SOFTWARE RENDERING${C_NC}"
          echo "------------------------------------------------------------"

          UUID="force-animations@software-rendering"
          EXT_DIR="/usr/share/gnome-shell/extensions/$UUID"

          echo -e "${C_YELLOW}[INFO] Installing GNOME Shell extension system-wide (semua user)...${C_NC}"
          sudo mkdir -p "$EXT_DIR"

          sudo tee "$EXT_DIR/metadata.json" > /dev/null <<'META_EOF'
          {
            "uuid": "force-animations@software-rendering",
            "name": "Force Animations on Software Rendering",
            "description": "Re-enables GNOME Shell animations on VMs, headless/CI desktops, Chrome Remote Desktop and any GPU-less environment that renders with llvmpipe/swrast, where GNOME Shell silently disables every animation.",
            "shell-version": ["45", "46", "47", "48", "49", "50"],
            "version-name": "1.1.0"
          }
          META_EOF

          sudo tee "$EXT_DIR/extension.js" > /dev/null <<'JS_EOF'
          /* extension.js -- Force GNOME Shell animations on software rendering.
           *
           * GNOME Shell (js/ui/main.js, AnimationsSettings) calls
           * St.Settings.inhibit_animations() whenever
           * backend.is_rendering_hardware_accelerated() is false (llvmpipe /
           * swrast, i.e. any GPU-less VM, CRD, VNC or RDP session). That
           * toolkit-level inhibit overrides
           * org.gnome.desktop.interface enable-animations, so the overview,
           * window, workspace and dash animations all become instant.
           *
           * GNOME's supported override is global.force_animations (a writable
           * Shell.Global property, blurb "Force animations to be enabled").
           * There is no GSetting and no environment variable for it, so it can
           * only be set from inside the shell -- i.e. from an extension.
           *
           * This extension additionally applies St.Settings.slow_down_factor so
           * animations run in slow motion (default factor 2.5, overridable via
           * the GNOME_SHELL_SLOWDOWN_FACTOR environment variable).
           */

          import GLib from 'gi://GLib';
          import St from 'gi://St';

          import {Extension} from 'resource:///org/gnome/shell/extensions/extension.js';

          const LOG_PREFIX = '[force-animations]';
          const DEFAULT_SLOWDOWN = 2.5;

          export default class ForceAnimationsExtension extends Extension {
              enable() {
                  this._previousForceAnimations = global.force_animations;
                  this._previousSlowDownFactor = St.Settings.get().slow_down_factor;
                  this._idleId = 0;

                  const slowdownEnv = GLib.getenv('GNOME_SHELL_SLOWDOWN_FACTOR');
                  const factor = slowdownEnv
                      ? (parseFloat(slowdownEnv) || DEFAULT_SLOWDOWN)
                      : DEFAULT_SLOWDOWN;

                  global.force_animations = true;
                  if (!isNaN(factor) && factor > 0.0) {
                      St.Settings.get().slow_down_factor = factor;
                  }

                  const before = St.Settings.get().enable_animations;

                  this._idleId = GLib.idle_add(GLib.PRIORITY_LOW, () => {
                      this._idleId = 0;
                      const settings = St.Settings.get();
                      console.log(
                          `${LOG_PREFIX} software_rendering=` +
                          `${!global.backend.is_rendering_hardware_accelerated()} ` +
                          `enable_animations_before=${before} ` +
                          `enable_animations_now=${settings.enable_animations} ` +
                          `slow_down_factor=${settings.slow_down_factor}`);
                      return GLib.SOURCE_REMOVE;
                  });
              }

              disable() {
                  if (this._idleId) {
                      GLib.source_remove(this._idleId);
                      this._idleId = 0;
                  }
                  global.force_animations = this._previousForceAnimations ?? false;
                  if (this._previousSlowDownFactor !== undefined) {
                      St.Settings.get().slow_down_factor = this._previousSlowDownFactor;
                  }
              }
          }
          JS_EOF

          sudo chmod 0755 "$EXT_DIR"
          sudo chmod 0644 "$EXT_DIR/metadata.json" "$EXT_DIR/extension.js"

          echo -e "${C_YELLOW}[INFO] Writing system-wide animation slow-down env...${C_NC}"
          sudo mkdir -p /etc/environment.d
          printf 'GNOME_SHELL_SLOWDOWN_FACTOR=2.5\n' | sudo tee /etc/environment.d/99-gnome-animation-slow.conf > /dev/null
          # Fallback untuk login via PAM (GDM/lightdm) agar env ikut tersedia.
          if ! grep -q 'GNOME_SHELL_SLOWDOWN_FACTOR' /etc/environment 2>/dev/null; then
              printf '\nGNOME_SHELL_SLOWDOWN_FACTOR=2.5\n' | sudo tee -a /etc/environment > /dev/null
          fi

          echo -e "${C_YELLOW}[INFO] Enabling extension system-wide via dconf...${C_NC}"
          sudo mkdir -p /etc/dconf/db/local.d
          sudo tee /etc/dconf/db/local.d/98-force-animations > /dev/null <<'DCONF_EOF'
          [org/gnome/shell]
          enabled-extensions=['force-animations@software-rendering']
          DCONF_EOF

          # Profil dconf user harus membaca system-db:local (idempoten).
          if ! sudo grep -qs '^system-db:local' /etc/dconf/profile/user 2>/dev/null; then
            printf 'user-db:user\nsystem-db:local\n' | sudo tee /etc/dconf/profile/user > /dev/null
          fi
          sudo dconf update || true

          echo -e "${C_YELLOW}[INFO] Fallback per-user gsettings untuk 'runner'...${C_NC}"
          # dbus-run-session menyediakan session dbus sementara agar gsettings
          # menulis ke dconf user 'runner' (dipakai saat CRD session menyala).
          sudo -u runner dbus-run-session -- gsettings set org.gnome.shell enabled-extensions "['$UUID']" || true
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.interface enable-animations true || true
          sudo chown -R runner:runner /home/runner/.config || true

          echo "------------------------------------------------------------"
          ls -l "$EXT_DIR" || true
          echo "--- enabled-extensions (runner) ---"
          sudo -u runner dbus-run-session -- gsettings get org.gnome.shell enabled-extensions || true
          echo "--- enable-animations (runner) ---"
          sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface enable-animations || true
          echo "--- animation slow-down env (system) ---"
          sudo cat /etc/environment.d/99-gnome-animation-slow.conf 2>/dev/null || true
          echo "--- animation slow-down env (user) ---"
          sudo -u runner cat /home/runner/.config/environment.d/99-gnome-animation-slow.conf 2>/dev/null || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Animations diaktifkan lewat override global.force_animations (slow_down_factor=2.5).${C_NC}"


      # ============================================================
      # INSTALL SAFE-UPGRADE HELPER
      # Pengganti `sudo apt upgrade` manual yang memutus sesi CRD.
      # ============================================================
      - name: Install Safe Upgrade Helper
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 12/19] INSTALL SAFE-UPGRADE HELPER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Copying repo scripts/safe-upgrade.sh...${C_NC}"
          if [ ! -f "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" ]; then
            echo -e "${C_RED}[FAIL] scripts/safe-upgrade.sh tidak ditemukan (checkout gagal).${C_NC}"
            exit 1
          fi
          sudo cp "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" /usr/local/bin/safe-upgrade
          sudo chmod +x /usr/local/bin/safe-upgrade || true
          sudo ln -sf /usr/local/bin/safe-upgrade /usr/bin/safe-upgrade || true

          # Shortcut Desktop + MOTD warning agar user tidak `apt upgrade` polos.
          sudo -u runner bash -c 'cat > /home/runner/Desktop/SafeUpgrade.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Safe Upgrade
          Comment=Gunakan ini pengganti apt upgrade (anti putus CRD)
          Exec=gnome-terminal -- bash -c "safe-upgrade; echo; read -n1 -p \"Tekan tombol untuk tutup...\""
          Icon=system-software-update
          Terminal=false
          EOF'
          sudo chmod +x /home/runner/Desktop/SafeUpgrade.desktop || true
          sudo chown runner:runner /home/runner/Desktop/SafeUpgrade.desktop || true

          echo 'JANGAN jalankan `sudo apt upgrade -y` polos di sesi CRD (memutus koneksi). Pakai: safe-upgrade' \
            | sudo tee /etc/motd > /dev/null || true

          echo "------------------------------------------------------------"
          ls -l /usr/local/bin/safe-upgrade || true
          safe-upgrade --help || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] safe-upgrade installed. Gunakan \`safe-upgrade\` pengganti \`apt upgrade\`.${C_NC}"


      # ============================================================
      # CREATE DESKTOP SHORTCUTS
      # ============================================================
      - name: Create Desktop Shortcuts
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 13/19] CREATE DESKTOP SHORTCUTS${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Creating Antigravity shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/Antigravity.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Antigravity
          Comment=Open Google Antigravity
          Exec=google-chrome --app=https://antigravity.google/ --no-sandbox
          Icon=google-chrome
          Terminal=false
          EOF'

          echo -e "${C_YELLOW}[INFO] Creating VS Code shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/VSCode.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Visual Studio Code
          Comment=Visual Studio Code
          Exec=code
          Icon=code
          Terminal=false
          EOF'

          # OpenCode Desktop (.deb sudah menyediakan .desktop di
          # /usr/share/applications, tinggal salin ke Desktop).
          # Fallback: buat manual jika file tidak ditemukan.
          echo -e "${C_YELLOW}[INFO] Linking OpenCode shortcut...${C_NC}"
          if ls /usr/share/applications/*opencode*.desktop 1> /dev/null 2>&1; then
            cp /usr/share/applications/*opencode*.desktop /home/runner/Desktop/ || true
          else
            sudo -u runner bash -c 'cat > /home/runner/Desktop/OpenCode.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=OpenCode
          Comment=OpenCode Desktop
          Exec=opencode-desktop
          Icon=opencode-desktop
          Terminal=false
          EOF'
          fi

          sudo chmod +x /home/runner/Desktop/*.desktop

          sudo chown -R runner:runner /home/runner/Desktop

          echo "------------------------------------------------------------"
          ls -l /home/runner/Desktop/*.desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Desktop shortcuts created.${C_NC}"


      # ============================================================
      # SET WALLPAPER (BLACK UNICAT / CATPPUCCIN)
      # ============================================================
      - name: Set Wallpaper
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 14/19] SET WALLPAPER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading Catppuccin 'black unicat' wallpaper...${C_NC}"
          sudo -u runner mkdir -p /home/runner/Pictures
          sudo -u runner wget -q -O /home/runner/Pictures/wallpaper.png \
            "https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/refs/heads/main/minimalistic/black5_unicat.png" \
            || { echo -e "${C_RED}[FAIL] Gagal mengunduh wallpaper.${C_NC}"; exit 1; }
          sudo chown runner:runner /home/runner/Pictures/wallpaper.png

          echo -e "${C_YELLOW}[INFO] Setting wallpaper via gsettings (GNOME schema)...${C_NC}"
          # dbus-run-session menyediakan session dbus sementara agar gsettings
          # menulis ke dconf user 'runner', yang dipakai saat CRD session menyala.
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.background picture-uri "file:///home/runner/Pictures/wallpaper.png" || true
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.background picture-uri-dark "file:///home/runner/Pictures/wallpaper.png" || true
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.background picture-options "zoom" || true
          sudo -u runner dbus-run-session -- gsettings set org.gnome.desktop.background picture-options-dark "zoom" || true

          # Fallback autostart: set ulang wallpaper saat session mulai,
          # meng-cover kasus dconf belum tercatat sebelum desktop jalan.
          sudo -u runner mkdir -p /home/runner/.config/autostart
          sudo -u runner bash -c 'cat > /home/runner/.config/autostart/set-wallpaper.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Set Wallpaper
          Exec=sh -c "sleep 3; gsettings set org.gnome.desktop.background picture-uri file:///home/runner/Pictures/wallpaper.png; gsettings set org.gnome.desktop.background picture-uri-dark file:///home/runner/Pictures/wallpaper.png; gsettings set org.gnome.desktop.background picture-options zoom"
          X-GNOME-Autostart-enabled=true
          Terminal=false
          EOF'

          echo "------------------------------------------------------------"
          ls -l /home/runner/Pictures/wallpaper.png || true
          sudo -u runner file /home/runner/Pictures/wallpaper.png || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Wallpaper installed and set for runner.${C_NC}"


      # ============================================================
      # INSTALL CATPPUCCIN THEME (MACCHIATO + MAUVE)
      #
      # Tema desktop lengkap untuk sesi CRD:
      #   1) Ikon Papirus + folder warna Catppuccin
      #   2) Tema GTK2/3/4 (berisi juga gnome-shell + css libadwaita)
      #   3) Override libadwaita di ~/.config/gtk-4.0 (Files, Settings, dll)
      #   4) Kursor Catppuccin
      #   5) Font JetBrainsMono Nerd Font
      #   6) GNOME Shell theme via user-theme extension
      #   7) Profil GNOME Terminal Catppuccin Macchiato
      #
      # Semua ditulis ke dconf user 'runner' lewat dbus-run-session (pola
      # yang sama dengan STEP 10/11/14) supaya langsung terbaca saat sesi
      # CRD menyala. Versi aset di-pin agar build reprodusibel.
      # ============================================================
      - name: Install Catppuccin Theme (Macchiato + Mauve)
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 15/19] INSTALL CATPPUCCIN THEME (MACCHIATO + MAUVE)${C_NC}"
          echo "------------------------------------------------------------"

          FLAVOR="macchiato"
          ACCENT="mauve"
          GTK_THEME="catppuccin-${FLAVOR}-${ACCENT}-standard+default"
          CURSOR_THEME="catppuccin-${FLAVOR}-${ACCENT}-cursors"
          RUSER="runner"
          RHOME="/home/${RUSER}"

          # ---- 1. Ikon Papirus + folder warna Catppuccin ----
          echo -e "${C_YELLOW}[INFO] Installing Papirus icon theme + Catppuccin folders...${C_NC}"
          sudo NEEDRESTART_MODE=l apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            papirus-icon-theme \
            gnome-shell-extensions

          rm -rf /tmp/papirus-folders
          git clone --depth 1 https://github.com/catppuccin/papirus-folders.git /tmp/papirus-folders
          wget -qO /tmp/papirus-folders-bin \
            https://raw.githubusercontent.com/PapirusDevelopmentTeam/papirus-folders/master/papirus-folders
          sudo install -m 0755 /tmp/papirus-folders-bin /usr/local/bin/papirus-folders
          sudo cp -r /tmp/papirus-folders/src/. /usr/share/icons/Papirus/
          sudo papirus-folders -C "cat-${FLAVOR}-${ACCENT}" --theme Papirus || true
          sudo papirus-folders -C "cat-${FLAVOR}-${ACCENT}" --theme Papirus-Dark || true

          # ---- 2. Tema GTK (GTK2/3/4 + gnome-shell + css libadwaita) ----
          # Nama aset mengandung '+', jadi di URL di-encode ke %2B.
          echo -e "${C_YELLOW}[INFO] Downloading Catppuccin GTK theme ($GTK_THEME)...${C_NC}"
          sudo -u "$RUSER" mkdir -p "$RHOME/.themes" "$RHOME/.icons"
          wget -qO /tmp/cat-gtk.zip \
            "https://github.com/catppuccin/gtk/releases/download/v1.0.3/${GTK_THEME//+/%2B}.zip"
          sudo -u "$RUSER" unzip -qo /tmp/cat-gtk.zip -d "$RHOME/.themes/"

          # Override libadwaita: gtk.css + assets ke ~/.config/gtk-4.0 supaya
          # aplikasi GTK4/libadwaita (Files, Settings, dll) ikut bertema.
          sudo -u "$RUSER" mkdir -p "$RHOME/.config/gtk-4.0"
          sudo -u "$RUSER" cp -r "$RHOME/.themes/$GTK_THEME/gtk-4.0/." "$RHOME/.config/gtk-4.0/"

          # ---- 3. Kursor Catppuccin ----
          echo -e "${C_YELLOW}[INFO] Downloading Catppuccin cursors...${C_NC}"
          wget -qO /tmp/cat-cursors.zip \
            "https://github.com/catppuccin/cursors/releases/download/v2.0.0/${CURSOR_THEME}.zip"
          sudo -u "$RUSER" unzip -qo /tmp/cat-cursors.zip -d "$RHOME/.icons/"

          # ---- 4. Font JetBrainsMono Nerd Font ----
          echo -e "${C_YELLOW}[INFO] Downloading JetBrainsMono Nerd Font...${C_NC}"
          sudo -u "$RUSER" mkdir -p "$RHOME/.local/share/fonts/JetBrainsMonoNerd"
          wget -qO /tmp/cat-font.zip \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.zip"
          sudo -u "$RUSER" unzip -qo /tmp/cat-font.zip -d "$RHOME/.local/share/fonts/JetBrainsMonoNerd"
          sudo -u "$RUSER" fc-cache -f "$RHOME/.local/share/fonts" >/dev/null 2>&1 || true

          # ---- 5. Terapkan tema via gsettings (dconf user runner) ----
          echo -e "${C_YELLOW}[INFO] Applying theme via gsettings (user: $RUSER)...${C_NC}"
          set_gs() { sudo -u "$RUSER" dbus-run-session -- gsettings set "$@" || true; }
          set_gs org.gnome.desktop.interface gtk-theme           "$GTK_THEME"
          set_gs org.gnome.desktop.interface icon-theme          "Papirus-Dark"
          set_gs org.gnome.desktop.interface cursor-theme        "$CURSOR_THEME"
          set_gs org.gnome.desktop.interface color-scheme        "prefer-dark"
          set_gs org.gnome.desktop.interface font-name           "JetBrainsMono Nerd Font 11"
          set_gs org.gnome.desktop.interface document-font-name  "JetBrainsMono Nerd Font 11"
          set_gs org.gnome.desktop.interface monospace-font-name "JetBrainsMono Nerd Font 12"

          # ---- 6. GNOME Shell theme (user-theme extension) ----
          # Saat build tidak ada shell yang berjalan, jadi `gnome-extensions
          # enable` tidak bisa dipakai -> set enabled/disabled-extensions
          # langsung via gsettings. enabled-extensions bersifat autoritatif,
          # jadi cukup daftarkan force-animations + user-theme di sini.
          THEME_EXT="user-theme@gnome-shell-extensions.gcampax.github.com"
          ANIM_EXT="force-animations@software-rendering"
          echo -e "${C_YELLOW}[INFO] Enabling user-theme extension + setting shell theme...${C_NC}"
          set_gs org.gnome.shell disabled-extensions "[]"
          set_gs org.gnome.shell enabled-extensions "['${ANIM_EXT}', '${THEME_EXT}']"
          set_gs org.gnome.shell.extensions.user-theme name "$GTK_THEME"

          # ---- 7. GNOME Terminal (profil Catppuccin Macchiato) ----
          echo -e "${C_YELLOW}[INFO] Installing Catppuccin GNOME Terminal profile...${C_NC}"
          rm -rf /tmp/cat-gnome-terminal
          git clone --depth 1 https://github.com/catppuccin/gnome-terminal.git /tmp/cat-gnome-terminal
          sudo -u "$RUSER" dbus-run-session -- bash -c \
            'cd /tmp/cat-gnome-terminal && python3 install.py' || true
          # Set profil Catppuccin Macchiato (uuid tetap dari skrip) sebagai default.
          sudo -u "$RUSER" dbus-run-session -- dconf write \
            /org/gnome/terminal/legacy/profiles:/default \
            "'5083e06b-024e-46be-9cd2-892b814f1fc8'" || true

          sudo chown -R "$RUSER:$RUSER" \
            "$RHOME/.themes" "$RHOME/.icons" "$RHOME/.config" "$RHOME/.local" 2>/dev/null || true

          # ---- 8. Bersihkan unduhan sementara ----
          rm -f /tmp/cat-gtk.zip /tmp/cat-cursors.zip /tmp/cat-font.zip /tmp/papirus-folders-bin

          echo "------------------------------------------------------------"
          echo "--- themes (runner) ---"; ls "$RHOME/.themes" || true
          echo "--- cursors (runner) ---"; ls "$RHOME/.icons" || true
          echo "--- gsettings (runner) ---"
          sudo -u "$RUSER" dbus-run-session -- gsettings get org.gnome.desktop.interface gtk-theme || true
          sudo -u "$RUSER" dbus-run-session -- gsettings get org.gnome.desktop.interface icon-theme || true
          sudo -u "$RUSER" dbus-run-session -- gsettings get org.gnome.desktop.interface cursor-theme || true
          sudo -u "$RUSER" dbus-run-session -- gsettings get org.gnome.shell.extensions.user-theme name || true
          sudo -u "$RUSER" dbus-run-session -- gsettings get org.gnome.Terminal.ProfilesList default || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Catppuccin $FLAVOR + $ACCENT terpasang (GTK, Shell, libadwaita, ikon, kursor, font, terminal).${C_NC}"


      # ============================================================
      # SET CRD PIN
      #
      # Default:
      #   123456
      #
      # Custom:
      #   Create GitHub Actions secret/variable:
      #
      #   CRD_PIN=your-pin
      # ============================================================
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 16/19] CONFIGURE CRD PIN${C_NC}"
          echo "------------------------------------------------------------"

          if [ -n "$CUSTOM_CRD_PIN" ]; then
            CRD_PIN="$CUSTOM_CRD_PIN"
            echo -e "${C_YELLOW}[INFO] Using custom CRD PIN from secret CRD_PIN.${C_NC}"
          else
            CRD_PIN="123456"
            echo -e "${C_YELLOW}[INFO] No CRD_PIN secret found.${C_NC}"
            echo -e "${C_YELLOW}[INFO] Using default PIN: 123456${C_NC}"
          fi

          # Validate PIN
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo -e "${C_RED}[FAIL] CRD_PIN must contain at least 6 digits.${C_NC}"
            exit 1
          fi

          echo "::add-mask::$CRD_PIN"

          echo "CRD_PIN=$CRD_PIN" >> "$GITHUB_ENV"

          echo -e "${C_GREEN}[OK] CRD PIN configured.${C_NC}"


      # ============================================================
      # AUTHORIZE VIA WEB + REGISTER CHROME REMOTE DESKTOP
      #
      # Kenapa: kode OAuth `--code=...` dari halaman headless Google hanya
      # sekali pakai dan cepat kadaluarsa. Instalasi desktop di STEP 01-16
      # butuh 20-40 menit, jadi kode yang diminta di awal (workflow_dispatch)
      # sudah kedaluwarsa saat dipakai.
      #
      # Solusi: setelah desktop siap, step ini menjalankan form web lokal dan
      # mengeksposnya lewat Cloudflare quick tunnel (tanpa akun). User baru
      # membuat kode SETELAH URL muncul, lalu submit dari jaringan mana pun.
      # Kalau registrasi gagal, user bisa submit kode baru tanpa re-run.
      #
      # Keamanan: URL memakai token acak 128-bit; form hanya menerima perintah
      # `start-host` (allowlist karakter); bind ke 127.0.0.1; hanya satu
      # perintah yang diproses pada satu waktu. Jangan bagikan URL ini.
      # ============================================================
      - name: Authorize & Register Chrome Remote Desktop (Wayland BETA)
        env:
          FALLBACK_CMD: ${{ inputs.crd_host_command }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 17/19] AUTHORIZE & REGISTER CRD (WAYLAND BETA)${C_NC}"
          echo "------------------------------------------------------------"

          STATE_DIR=/tmp/crd-web-auth
          SERVER="$GITHUB_WORKSPACE/scripts/crd-web-auth.py"
          PORT=8787
          TIMEOUT_MINUTES=30
          RUNNER_UID=$(id -u runner)

          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          if [ ! -f "$SERVER" ]; then
            echo -e "${C_RED}[FAIL] scripts/crd-web-auth.py tidak ditemukan (checkout gagal).${C_NC}"
            exit 1
          fi

          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"

          CRD_WEB_TOKEN="$(openssl rand -hex 16)"
          export CRD_WEB_STATE="$STATE_DIR"
          export CRD_WEB_PORT="$PORT"
          export CRD_WEB_TOKEN
          TOKEN="$CRD_WEB_TOKEN"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))

          python3 "$SERVER" set-status waiting \
            "Menunggu perintah Chrome Remote Desktop..." --deadline "$DEADLINE"

          echo -e "${C_YELLOW}[INFO] Starting form server on 127.0.0.1:$PORT ...${C_NC}"
          python3 "$SERVER" > "$STATE_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          sleep 1
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo -e "${C_RED}[FAIL] Server form gagal start.${C_NC}"
            cat "$STATE_DIR/server.log" || true
            exit 1
          fi

          CLOUDFLARED=/tmp/cloudflared
          if [ ! -x "$CLOUDFLARED" ]; then
            echo -e "${C_YELLOW}[INFO] Downloading cloudflared...${C_NC}"
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "$CLOUDFLARED" \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x "$CLOUDFLARED"
          fi

          TUNNEL_LOG="$STATE_DIR/tunnel.log"
          TUNNEL_PID=""
          PUBLIC_URL=""
          TUNNEL_RESTARTS=0

          start_tunnel() {
            local proto="${1:-}"
            : > "$TUNNEL_LOG"
            if [ -n "$proto" ]; then
              nohup "$CLOUDFLARED" tunnel --no-autoupdate --protocol "$proto" \
                --url "http://127.0.0.1:$PORT" >> "$TUNNEL_LOG" 2>&1 &
            else
              nohup "$CLOUDFLARED" tunnel --no-autoupdate \
                --url "http://127.0.0.1:$PORT" >> "$TUNNEL_LOG" 2>&1 &
            fi
            TUNNEL_PID=$!
            PUBLIC_URL=""
            local _i
            for _i in {1..30}; do
              PUBLIC_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n1 || true)"
              if [ -n "$PUBLIC_URL" ]; then
                return 0
              fi
              kill -0 "$TUNNEL_PID" 2>/dev/null || return 1
              sleep 1
            done
            return 1
          }

          stop_process() {
            local pid="$1"
            local _i
            [ -z "$pid" ] && return 0
            kill "$pid" 2>/dev/null || true
            for _i in {1..10}; do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.1
            done
            kill -9 "$pid" 2>/dev/null || true
          }

          cleanup_tunnel() {
            stop_process "$TUNNEL_PID"
          }

          cleanup() {
            cleanup_tunnel
            stop_process "$SERVER_PID"
          }
          trap cleanup EXIT

          announce_url() {
            local url="$1"
            echo ""
            echo "=============================================================="
            echo -e "${C_GREEN}      [OK] FORM OTORISASI SIAP${C_NC}"
            echo "=============================================================="
            echo -e "      [INFO] URL   : ${url}/${TOKEN}/"
            echo -e "      [INFO] Batas : ${TIMEOUT_MINUTES} menit"
            echo ""
            echo "      Langkah:"
            echo "      1. Buka URL di atas (bisa dari HP / jaringan lain)."
            echo "         Jika muncul error Cloudflare, tunggu ~15 detik lalu refresh."
            echo "      2. Buka https://remotedesktop.google.com/headless di tab lain,"
            echo "         login, Begin -> Next -> Authorize."
            echo "      3. Copy SELURUH perintah Debian Linux, paste ke form, submit."
            echo "=============================================================="
            echo ""
            echo "::notice title=CRD Authorization::Buka ${url}/${TOKEN}/ lalu paste perintah Chrome Remote Desktop."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## 🔐 Otorisasi Chrome Remote Desktop"
                echo ""
                echo "Desktop sudah siap. Buka URL berikut lalu paste perintah dari"
                echo "<https://remotedesktop.google.com/headless> (berlaku ±${TIMEOUT_MINUTES} menit):"
                echo ""
                echo "**<${url}/${TOKEN}/>**"
                echo ""
                echo "_Jika URL menampilkan error Cloudflare (1033/502), tunggu ~15 detik lalu refresh._"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          register_command() {
            local cmd="$1"
            local attempt rc
            local clean

            # Bersihkan input + buang --name lama; device selalu dinamai "gnome".
            clean="$(printf '%s' "$cmd" | tr -d '\r' | sed -E 's/--name=("[^"]*"|[^ ]*)//g' | sed 's/[[:space:]]*$//')"
            echo "::add-mask::$clean"

            if ! printf '%s' "$clean" | grep -q 'start-host'; then
              echo -e "${C_RED}[FAIL] Perintah tidak mengandung 'start-host'.${C_NC}"
              return 1
            fi
            # Defense in depth: server sudah memvalidasi, tapi jangan percaya
            # mentah-mentah karena perintah dieksekusi lewat `bash -c`.
            if printf '%s' "$clean" | grep -qE '\\|\$\(|`|;|&|\||>|<'; then
              echo -e "${C_RED}[FAIL] Perintah mengandung karakter berbahaya.${C_NC}"
              return 1
            fi
            clean="$clean --name=\"gnome\""

            echo -e "${C_YELLOW}[INFO] Registering host as user 'runner' (retry 3x jika OAuth transien)...${C_NC}"
            rc=1
            for attempt in 1 2 3; do
              python3 "$SERVER" set-status registering \
                "Mendaftarkan perangkat... (percobaan ${attempt}/3)" --attempts "$attempt" || true
              echo -e "${C_YELLOW}[INFO] Registration attempt ${attempt}/3 ...${C_NC}"
              if sudo -u runner \
                env CRD_PIN="$CRD_PIN" \
                bash -c "$clean --pin=\"$CRD_PIN\""; then
                rc=0
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo -e "${C_YELLOW}[WARN] Registrasi gagal (mungkin kode single-use kadaluarsa/terpakai, atau error transien). Retry dalam $((attempt * 5))s...${C_NC}"
                sleep $((attempt * 5))
              fi
            done
            return "$rc"
          }

          RESULT=""

          if ! start_tunnel; then
            echo -e "${C_YELLOW}[WARN] Tunnel QUIC gagal, mencoba protocol http2...${C_NC}"
            cleanup_tunnel
            start_tunnel http2 || true
          fi

          if [ -z "$PUBLIC_URL" ]; then
            echo -e "${C_RED}[FAIL] Cloudflare quick tunnel tidak bisa dibuat.${C_NC}"
            tail -n 40 "$TUNNEL_LOG" || true

            # Fallback opsional: input crd_host_command dari workflow_dispatch.
            if [ -n "$FALLBACK_CMD" ]; then
              echo -e "${C_YELLOW}[INFO] Memakai crd_host_command dari workflow_dispatch sebagai fallback.${C_NC}"
              if register_command "$FALLBACK_CMD"; then
                RESULT=success
              fi
            fi

            if [ "$RESULT" != "success" ]; then
              python3 "$SERVER" set-status failed \
                "Tunnel gagal dibuat. Jalankan ulang workflow." \
                --error "cloudflared tidak menghasilkan URL publik" || true
              echo -e "${C_RED}[FAIL] Tidak ada form web maupun fallback command yang berhasil.${C_NC}"
              exit 1
            fi
          else
            announce_url "$PUBLIC_URL"

            echo -e "${C_YELLOW}[INFO] Menunggu perintah dari form web (maks ${TIMEOUT_MINUTES} menit)...${C_NC}"

            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              # Cek ringan tanpa spawn proses Python tiap 2 detik.
              if grep -q '"state": "success"' "$STATE_DIR/status.json" 2>/dev/null; then
                RESULT=success
                break
              fi

              if [ -f "$STATE_DIR/command" ]; then
                if mv "$STATE_DIR/command" "$STATE_DIR/command.processing" 2>/dev/null; then
                  SUBMITTED="$(cat "$STATE_DIR/command.processing" 2>/dev/null || true)"
                  echo -e "${C_GREEN}[OK] Perintah diterima dari form web.${C_NC}"
                  if register_command "$SUBMITTED"; then
                    rm -f "$STATE_DIR/command.processing"
                    RESULT=success
                    break
                  fi
                  rm -f "$STATE_DIR/command.processing"
                  python3 "$SERVER" set-status failed \
                    "Registrasi gagal. Ambil kode BARU di halaman headless lalu submit lagi." \
                    --error "Kode OAuth kemungkinan sudah terpakai/kadaluarsa, atau error jaringan. Detail ada di log workflow." || true
                  echo -e "${C_YELLOW}[WARN] Registrasi gagal; menunggu kode baru dari form (tanpa re-run).${C_NC}"
                fi
              fi

              # Restart tunnel kalau cloudflared mati (URL publik akan berubah).
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                TUNNEL_RESTARTS=$((TUNNEL_RESTARTS + 1))
                echo -e "${C_YELLOW}[WARN] Tunnel berhenti. Restart ${TUNNEL_RESTARTS}/3...${C_NC}"
                if [ "$TUNNEL_RESTARTS" -gt 3 ] || ! start_tunnel; then
                  python3 "$SERVER" set-status failed \
                    "Tunnel bermasalah. Jalankan ulang workflow." \
                    --error "cloudflared berhenti berulang kali" || true
                  echo -e "${C_RED}[FAIL] Tunnel tidak bisa dipertahankan.${C_NC}"
                  exit 1
                fi
                announce_url "$PUBLIC_URL"
              fi

              sleep 2
            done

            if [ "$RESULT" != "success" ]; then
              python3 "$SERVER" set-status failed \
                "Waktu tunggu ${TIMEOUT_MINUTES} menit habis. Jalankan ulang workflow." \
                --error "Tidak ada perintah valid yang diterima" || true
              echo ""
              echo -e "${C_RED}[FAIL] Tidak ada perintah dari form dalam ${TIMEOUT_MINUTES} menit.${C_NC}"
              echo -e "${C_RED}  Re-run workflow ini; cache .deb membuat re-run jauh lebih cepat.${C_NC}"
              exit 1
            fi
          fi

          echo -e "${C_GREEN}[OK] Perintah berhasil didaftarkan.${C_NC}"

          # Beri browser kesempatan polling terakhir sebelum tunnel dimatikan.
          sleep 5
          cleanup_tunnel
          echo -e "${C_YELLOW}[INFO] Form otorisasi ditutup.${C_NC}"

          # Fallback: `start-host` mencoba `sudo`/`pkexec systemctl enable --now
          # chrome-remote-desktop@<user>`. Tapi tanpa TTY (seperti di runner
          # ini, stdin diarahkan ke /dev/null) metode itu bisa gagal senyap,
          # sehingga host terdaftar tapi service tidak pernah jalan. Pastikan
          # di sini supaya device langsung bisa di-connect.
          echo -e "${C_YELLOW}[INFO] Memastikan chrome-remote-desktop@runner.service aktif...${C_NC}"
          sudo systemctl enable chrome-remote-desktop@runner >/dev/null 2>&1 || true
          sudo systemctl start chrome-remote-desktop@runner >/dev/null 2>&1 || true
          sleep 2
          if ! systemctl is-active --quiet chrome-remote-desktop@runner; then
            echo -e "${C_RED}[FAIL] chrome-remote-desktop@runner tidak aktif.${C_NC}"
            systemctl status chrome-remote-desktop@runner --no-pager || true
            sudo journalctl -u chrome-remote-desktop@runner -n 150 --no-pager || true
            python3 "$SERVER" set-status failed \
              "Service CRD tidak aktif. Lihat log workflow (Wayland BETA)." \
              --error "chrome-remote-desktop@runner inactive" || true
            exit 1
          fi
          echo -e "${C_GREEN}[OK] chrome-remote-desktop@runner aktif.${C_NC}"

          # Verifikasi bahwa GNOME Shell benar-benar menjadi compositor
          # Wayland headless. Tanpa WAYLAND_DISPLAY di systemd user env,
          # CRD tidak akan bisa stream desktop walau device sudah terdaftar.
          echo -e "${C_YELLOW}[INFO] Menunggu GNOME Shell Wayland headless siap...${C_NC}"
          WAYLAND_READY=0
          WAYLAND_SOCKET=""
          for i in {1..45}; do
            WAYLAND_SOCKET="$(as_runner systemctl --user show-environment 2>/dev/null | sed -n 's/^WAYLAND_DISPLAY=//p' | head -n1)"
            if [ -n "$WAYLAND_SOCKET" ] && [ -S "/run/user/$RUNNER_UID/$WAYLAND_SOCKET" ]; then
              WAYLAND_READY=1
              break
            fi
            sleep 2
          done

          if [ "$WAYLAND_READY" -ne 1 ]; then
            echo ""
            echo -e "${C_RED}[FAIL] GNOME Wayland compositor tidak siap dalam ~90 detik.${C_NC}"
            echo -e "${C_YELLOW}[INFO] Ini ciri khas mode BETA gagal: shell headless / portal / PipeWire.${C_NC}"
            echo "::group::[DEBUG] chrome-remote-desktop@runner"
            systemctl status chrome-remote-desktop@runner --no-pager || true
            sudo journalctl -u chrome-remote-desktop@runner -n 200 --no-pager || true
            echo "::endgroup::"
            echo "::group::[DEBUG] GNOME Shell user service"
            as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager || true
            as_runner journalctl --user -n 200 --no-pager || true
            echo "::endgroup::"
            echo "::group::[DEBUG] Proses & runtime"
            pgrep -a -x gnome-shell || true
            pgrep -a -x gnome-session || true
            pgrep -a chrome-remote || true
            ls -la "/run/user/$RUNNER_UID" | head -n 40 || true
            echo "::endgroup::"
            python3 "$SERVER" set-status failed \
              "GNOME Wayland gagal start. Workflow BETA ini belum berhasil di runner." \
              --error "WAYLAND_DISPLAY tidak muncul / socket tidak ada" || true
            exit 1
          fi

          echo -e "${C_GREEN}[OK] Wayland compositor aktif: WAYLAND_DISPLAY=$WAYLAND_SOCKET${C_NC}"
          as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager || true
          echo "--- GNOME Shell processes ---"
          pgrep -a -x gnome-shell || true
          pgrep -a -x gnome-session || true
          echo "--- CRD host readiness ---"
          sudo journalctl -u chrome-remote-desktop@runner -n 40 --no-pager || true

          python3 "$SERVER" set-status success \
            "Berhasil! Buka https://remotedesktop.google.com/access dan pilih device 'gnome'." || true

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}      [OK] CHROME REMOTE DESKTOP READY (WAYLAND BETA)${C_NC}"
          echo "=============================================================="
          echo -e "      [INFO] Access    : https://remotedesktop.google.com/access"
          echo -e "      [INFO] User      : runner"
          echo -e "      [INFO] PIN       : default 123456 (or custom via secret CRD_PIN)"
          echo "=============================================================="
          echo ""
          echo "::notice::CRD ready - connect via https://remotedesktop.google.com/access as user runner"


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          RUNNER_UID=$(id -u runner)
          as_runner() {
            sudo -u runner env \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$RUNNER_UID/bus" \
              "$@"
          }

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 18/19] VERIFY INSTALLATION${C_NC}"
          echo "------------------------------------------------------------"

          echo "::group::[CHECK] System"
          uname -a
          echo "::endgroup::"

          echo "::group::[CHECK] GNOME Wayland session (BETA)"
          gnome-shell --version || true
          echo "--- old X11 session file (harus tidak ada) ---"
          if [ -e /home/runner/.chrome-remote-desktop-session ]; then
            echo "[WARN] .chrome-remote-desktop-session masih ada (tidak dipakai mode Wayland)."
            cat /home/runner/.chrome-remote-desktop-session || true
          else
            echo "[OK] .chrome-remote-desktop-session tidak ada."
          fi

          echo "--- CRD Wayland drop-in ---"
          systemctl cat chrome-remote-desktop@runner 2>/dev/null | tail -n 40 || true
          echo "--- GNOME Shell headless override ---"
          cat /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf || true

          echo "--- user manager environment ---"
          as_runner systemctl --user show-environment 2>/dev/null | grep -E 'WAYLAND_DISPLAY|XDG_SESSION_TYPE|XDG_CURRENT_DESKTOP|XDG_SESSION_DESKTOP' || true

          WAYLAND_DISPLAY_VALUE=$(as_runner systemctl --user show-environment 2>/dev/null | sed -n 's/^WAYLAND_DISPLAY=//p')
          if [ -z "$WAYLAND_DISPLAY_VALUE" ]; then
            echo -e "${C_RED}[FAIL] WAYLAND_DISPLAY belum diekspor ke systemd user environment.${C_NC}"
            exit 1
          fi
          if [ ! -S "/run/user/$RUNNER_UID/$WAYLAND_DISPLAY_VALUE" ]; then
            echo -e "${C_RED}[FAIL] Socket Wayland tidak ada: /run/user/$RUNNER_UID/$WAYLAND_DISPLAY_VALUE${C_NC}"
            exit 1
          fi
          echo -e "${C_GREEN}[OK] Wayland compositor aktif: WAYLAND_DISPLAY=$WAYLAND_DISPLAY_VALUE${C_NC}"

          echo "--- GNOME Shell user service ---"
          as_runner systemctl --user status org.gnome.Shell@ubuntu.service --no-pager 2>/dev/null || true
          as_runner journalctl --user -u org.gnome.Shell@ubuntu.service -n 40 --no-pager 2>/dev/null || true

          if systemctl is-active --quiet chrome-remote-desktop@runner; then
            echo -e "${C_GREEN}[OK] chrome-remote-desktop@runner aktif.${C_NC}"
          else
            echo -e "${C_RED}[FAIL] chrome-remote-desktop@runner tidak aktif.${C_NC}"
            systemctl status chrome-remote-desktop@runner --no-pager || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] screensaver/lock disabled"
          cat /etc/dconf/db/local.d/99-crd-no-lock || true
          echo "::endgroup::"

          echo "::group::[CHECK] GNOME animations on software rendering"
          ls -l /usr/share/gnome-shell/extensions/force-animations@software-rendering/ || true
          echo "--- dconf system default ---"
          cat /etc/dconf/db/local.d/98-force-animations || true
          echo "--- enabled-extensions (runner) ---"
          sudo -u runner dbus-run-session -- gsettings get org.gnome.shell enabled-extensions || true
          echo "--- enable-animations (runner) ---"
          sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface enable-animations || true
          if sudo -u runner dbus-run-session -- gsettings get org.gnome.shell enabled-extensions 2>/dev/null | grep -q 'force-animations@software-rendering'; then
            echo -e "${C_GREEN}[OK] force-animations terdaftar: animasi hidup walau software rendering.${C_NC}"
          else
            echo "[WARN] force-animations TIDAK terdaftar di enabled-extensions."
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] Wayland virtual monitor (1920x1080)"
          if grep -q -- "--headless" /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf 2>/dev/null &&
             grep -q -- "--virtual-monitor 1920x1080" /etc/systemd/user/org.gnome.Shell@.service.d/10-headless-beta.conf 2>/dev/null; then
            echo -e "${C_GREEN}[OK] GNOME Shell headless + virtual monitor 1920x1080.${C_NC}"
          else
            echo "[WARN] override headless/virtual-monitor tidak sesuai."
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] Catppuccin theme (macchiato + mauve)"
          ls -d /home/runner/.themes/catppuccin-macchiato-mauve-standard+default || true
          ls -d /home/runner/.icons/catppuccin-macchiato-mauve-cursors || true
          ls /home/runner/.config/gtk-4.0/gtk.css || true
          ls /home/runner/.local/share/fonts/JetBrainsMonoNerd/ | head -n 3 || true
          echo "--- gsettings (runner) ---"
          sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface gtk-theme || true
          sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface icon-theme || true
          sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface cursor-theme || true
          sudo -u runner dbus-run-session -- gsettings get org.gnome.shell.extensions.user-theme name || true
          sudo -u runner dbus-run-session -- gsettings get org.gnome.Terminal.ProfilesList default || true
          if sudo -u runner dbus-run-session -- gsettings get org.gnome.desktop.interface gtk-theme 2>/dev/null | grep -q 'catppuccin-macchiato-mauve'; then
            echo -e "${C_GREEN}[OK] Catppuccin theme aktif (GTK/Shell/ikon/kursor/font/terminal).${C_NC}"
          else
            echo "[WARN] Catppuccin theme tidak terpasang."
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] timezone (Asia/Jakarta)"
          cat /etc/timezone || true
          ls -l /etc/localtime || true
          date || true
          if [ "$(cat /etc/timezone 2>/dev/null)" = "Asia/Jakarta" ] && [ "$(date +%z)" = "+0700" ]; then
            echo -e "${C_GREEN}[OK] timezone WIB (Asia/Jakarta, +0700).${C_NC}"
          else
            echo "[WARN] timezone bukan Asia/Jakarta."
          fi
          echo "::endgroup::"

          echo "::group::[CHECK] safe-upgrade helper"
          which safe-upgrade || true
          ls -l /usr/local/bin/safe-upgrade || true
          safe-upgrade --help || true
          ls -l /home/runner/Desktop/SafeUpgrade.desktop || true
          echo "::endgroup::"

          echo "::group::[CHECK] Google Chrome"
          google-chrome --version || true
          echo "::endgroup::"

          echo "::group::[CHECK] VS Code"
          code --version || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode CLI"
          opencode --version || true
          which opencode || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode Desktop"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          ls /home/runner/Desktop/*pencode*.desktop || true
          echo "::endgroup::"

          echo "::group::[CHECK] Chrome Remote Desktop service"
          systemctl status \
            chrome-remote-desktop@runner.service \
            --no-pager \
            || true
          echo "::endgroup::"

          echo "::group::[CHECK] Remote user"
          id runner
          echo "::endgroup::"

          echo "::group::[CHECK] KVM / Virtualization"
          ls -l /dev/kvm || true
          getent group kvm libvirt || true
          if sudo -u runner test -r /dev/kvm && sudo -u runner test -w /dev/kvm; then
            echo -e "${C_GREEN}[OK] runner dapat mengakses /dev/kvm.${C_NC}"
          else
            echo -e "${C_YELLOW}[WARN] runner tidak bisa akses /dev/kvm - instalasi tetap OK; KVM off di runner ini (lihat README, bagian KVM).${C_NC}"
          fi
          command -v qemu-system-x86_64 || echo "[WARN] qemu-system-x86_64 missing"
          command -v virsh || echo "[WARN] virsh missing"
          command -v virt-manager || echo "[WARN] virt-manager missing"
          command -v gnome-boxes || echo "[WARN] gnome-boxes missing"
          systemctl is-enabled libvirtd 2>/dev/null || true
          systemctl is-active libvirtd 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::[CHECK] Snap removed"
          command -v snap >/dev/null 2>&1 && echo -e "${C_YELLOW}[WARN] snap masih terpasang.${C_NC}" || echo -e "${C_GREEN}[OK] snap / snapd removed.${C_NC}"
          dpkg -l thunderbird 2>/dev/null | grep -q ^ii && echo -e "${C_YELLOW}[WARN] thunderbird transisi masih terpasang.${C_NC}" || echo -e "${C_GREEN}[OK] thunderbird (snap transitional) removed.${C_NC}"
          apt-mark showhold | grep -qx snapd && echo -e "${C_GREEN}[OK] snapd held (tidak akan re-install).${C_NC}" || echo -e "${C_YELLOW}[WARN] snapd tidak di-hold.${C_NC}"
          echo "::endgroup::"

          echo ""
          echo -e "${C_GREEN}[OK] Installation verification completed.${C_NC}"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          # Hitung sisa waktu dari batas job 360 menit, bukan sleep 21600 fix.
          # Install + tunggu form web + verify memakan waktu, jadi sleep fix
          # akan menabrak timeout job dan mematikan sesi lebih cepat dari 6 jam.
          JOB_START="${JOB_START_EPOCH:-$(date +%s)}"
          ELAPSED=$(( $(date +%s) - JOB_START ))
          SLEEP_SECONDS=$(( 360 * 60 - ELAPSED - 60 ))
          if [ "$SLEEP_SECONDS" -lt 60 ]; then
            SLEEP_SECONDS=60
          fi

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}  [OK] CHROME REMOTE DESKTOP IS RUNNING${C_NC}"
          echo "=============================================================="
          echo -e "  ${C_YELLOW}[INFO] Keep-alive ${SLEEP_SECONDS}s (elapsed ${ELAPSED}s). Jangan cancel workflow.${C_NC}"
          echo -e "  [INFO] Access : https://remotedesktop.google.com/access"
          echo -e "  [INFO] User   : runner"
          echo "=============================================================="

          sleep "$SLEEP_SECONDS"
