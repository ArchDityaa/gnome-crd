name: Bug report
description: Laporkan masalah pada workflow GNOME 26 (GNOME + CRD)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. **Jangan pernah paste** URL form otorisasi
        (mengandung token), isi `crd_host_command`, kode OAuth (`--code=...`),
        atau PIN Anda. Cukup tempelkan potongan LOG yang relevan.

  - type: dropdown
    id: where
    attributes:
      label: Di mana masalahnya?
      options:
        - Workflow gagal saat build/install
        - URL form otorisasi tidak muncul / error Cloudflare
        - Registrasi Chrome Remote Desktop via form gagal
        - Sudah "READY" tapi tidak bisa connect
        - Desktop/sesi bermasalah setelah connect (tema, resolusi, dsb.)
        - Lainnya
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Nama step yang gagal (jika workflow gagal)
      placeholder: "Contoh: Authorize & Register Chrome Remote Desktop (Web UI)"
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan singkat masalah dan apa yang Anda harapkan.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Potongan log
      description: |
        Tempelkan bagian log yang relevan (tanpa data sensitif).
      render: shell
    validations:
      required: false

  - type: input
    id: runurl
    attributes:
      label: URL run (opsional)
      placeholder: "https://github.com/<user>/<repo>/actions/runs/<id>"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: Saya sudah mengaktifkan Actions di fork (Settings → Actions → Allow all actions).
          required: false
        - label: Kalau registrasi gagal, saya sudah mencoba submit kode BARU di form tanpa re-run.
          required: false
        - label: Saya tidak menyertakan URL form/token, kode OAuth, atau PIN di laporan ini.
          required: true
