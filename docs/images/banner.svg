<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RICH LINUX - GNOME + Chrome Remote Desktop">
  <title>RICH LINUX - GNOME + Chrome Remote Desktop</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24273a"/>
      <stop offset="55%" stop-color="#1e2030"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6a0f6"/>
      <stop offset="50%" stop-color="#f5bde6"/>
      <stop offset="100%" stop-color="#8aadf4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- dekorasi -->
  <circle cx="1120" cy="40" r="180" fill="#c6a0f6" opacity="0.06"/>
  <circle cx="120" cy="300" r="140" fill="#8aadf4" opacity="0.06"/>

  <!-- label atas -->
  <text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#8aadf4" letter-spacing="2">UBUNTU 24.04 · 4 vCPU · 16 GB RAM · MAX 6 JAM</text>

  <!-- judul -->
  <text x="62" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="74" font-weight="700" fill="#c6a0f6">RICH LINUX</text>

  <text x="64" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" fill="#cad3f5">GNOME + Chrome Remote Desktop</text>

  <rect x="64" y="232" width="300" height="6" rx="3" fill="url(#accent)"/>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="64"  y="262" width="96"  height="34" rx="17" fill="#363a4f"/>
    <text x="112" y="285" fill="#a6da95" text-anchor="middle">fork</text>

    <rect x="176" y="262" width="96"  height="34" rx="17" fill="#363a4f"/>
    <text x="224" y="285" fill="#eed49f" text-anchor="middle">run</text>

    <rect x="288" y="262" width="132" height="34" rx="17" fill="#363a4f"/>
    <text x="354" y="285" fill="#f5bde6" text-anchor="middle">connect</text>
  </g>

  <!-- panel terminal -->
  <rect x="760" y="56" width="456" height="208" rx="16" fill="#181926" stroke="#363a4f" stroke-width="2"/>
  <circle cx="790" cy="86" r="7" fill="#ed8796"/>
  <circle cx="814" cy="86" r="7" fill="#eed49f"/>
  <circle cx="838" cy="86" r="7" fill="#a6da95"/>
  <line x1="760" y1="108" x2="1216" y2="108" stroke="#363a4f" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="790" y="142" fill="#a6da95">runner@gnome:~$</text>
    <text x="790" y="170" fill="#cad3f5">sudo safe-upgrade</text>
    <text x="790" y="198" fill="#8aadf4">[OK] GNOME + CRD siap</text>
    <text x="790" y="226" fill="#c6a0f6">access: remotedesktop.google.com</text>
  </g>
</svg>
